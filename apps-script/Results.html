<script>
// Presentation-only aggregation; all physical results are supplied by the engine.
window.STResults=(function(){
  function number(value,digits){return Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:digits===undefined?1:digits}):'—';}
  function downtime(result){return Object.values(result.equipmentMetrics||{}).reduce(function(n,m){return n+(m.pausedSeconds||0)+(m.stoppedSeconds||0)+(m.failureSeconds||0)+(m.microStopSeconds||0)+(m.emergencyStopSeconds||0);},0)/60;}
  function metrics(result){var s=result.summary;return [
    ['Global OEE',s.lineOeePercent,'%',false],['Throughput',s.averageOutputRatePerSecond*60,' / min',false],['Production',s.outputCount,' units',false],
    ['Equipment downtime',downtime(result),' min',true],['Starving',s.totalStarvedSeconds/60,' min',true],['Blocking',s.totalBlockedSeconds/60,' min',true],['Failure time',s.totalFailureSeconds/60,' min',true]
  ];}
  function render(result,activeCase){
    var ready=Boolean(result&&result.summary);
    document.getElementById('results-empty').classList.toggle('hidden',ready);document.getElementById('results-body').classList.toggle('hidden',!ready);document.getElementById('export-results').disabled=!ready;
    if(!ready){document.getElementById('results-meta').textContent='Complete a simulation to inspect the results.';return;}
    document.getElementById('results-meta').textContent=activeCase.name+' · Full run · '+result.durationSeconds+' s · Seed '+result.seed;
    var target=document.getElementById('results-kpis');target.textContent='';
    metrics(result).forEach(function(item,index){var card=document.createElement('article');card.className='result-kpi'+(index===0?' primary-kpi':'');var label=document.createElement('span'),value=document.createElement('strong');label.textContent=item[0];value.textContent=number(item[1])+item[2];card.append(label,value);target.appendChild(card);});
    document.getElementById('results-reference').textContent='OEE reference: '+(result.summary.lineOeePacemakerName||'not available')+'. Quality assumes 100% (no reject model). Loss and downtime totals are equipment-minutes; simultaneous losses are not line downtime.';
    var rows=(activeCase.equipment||[]).map(function(e){return {model:e,metric:(result.equipmentMetrics||{})[e.id]||{}};});
    var worst=rows.filter(function(r){return r.model.type!=='CONVEYOR';}).sort(function(a,b){return (b.metric.starvedSeconds||0)+(b.metric.blockedSeconds||0)+(b.metric.failureSeconds||0)-(a.metric.starvedSeconds||0)-(a.metric.blockedSeconds||0)-(a.metric.failureSeconds||0);})[0];
    document.getElementById('results-insight').textContent=worst?'Investigate '+worst.model.name+': highest combined starving, blocking and failure time among machines. This is a loss indicator, not proof of the line bottleneck.':'';
    var table=document.createElement('table'); table.innerHTML='<thead><tr><th>Equipment</th><th>Type</th><th class="numeric">OEE</th><th class="numeric">Produced / processed</th><th class="numeric">Starved · min</th><th class="numeric">Blocked · min</th><th class="numeric">Failure · min</th><th class="numeric">Failures</th></tr></thead>';
    var body=document.createElement('tbody'); rows.forEach(function(r){var m=r.metric,tr=document.createElement('tr');[r.model.name,r.model.type,number(m.oeePercent)+'%',number(m.outputCount),number(m.starvedSeconds/60),number(m.blockedSeconds/60),number(m.failureSeconds/60),number(m.failureCount,0)].forEach(function(v,i){var td=document.createElement('td');td.textContent=v; if(i>1)td.className='numeric';tr.appendChild(td);});body.appendChild(tr);});table.appendChild(body);document.getElementById('results-table').replaceChildren(table);
    document.getElementById('export-results').onclick=function(){var blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='simulation-results.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);};
  }
  function compare(target,a,b){
    if(!a.results?.summary||!b.results?.summary)return;
    var section=document.createElement('section');section.className='comparison-section';section.innerHTML='<h3>Outcome comparison</h3><div class="table-scroll"><table><thead><tr><th>Metric</th><th class="numeric">Baseline</th><th class="numeric">Proposed</th><th class="numeric">Absolute Δ</th><th class="numeric">Relative Δ</th></tr></thead><tbody></tbody></table></div>';
    var right=metrics(b.results);
    metrics(a.results).forEach(function(m,i){var n=right[i][1],d=n-m[1],tr=document.createElement('tr');[m[0],number(m[1])+m[2],number(n)+m[2],(d>0?'+':'')+number(d)+(i===0?' pp':m[2]),m[1]===0?'N/A (zero baseline)':(d>0?'+':'')+number(d/Math.abs(m[1])*100)+'%'].forEach(function(v,j){var td=document.createElement('td');td.textContent=v;if(j)td.className='numeric';tr.appendChild(td);});section.querySelector('tbody').appendChild(tr);});target.appendChild(section);
  }
  return {render:render,compare:compare};
})();
</script>
