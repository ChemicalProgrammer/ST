<script>
  (function() {
    var state = {
      bootstrap: null,
      requestEpoch: 0,
      pendingRequests: 0,
      openSequence: 0,
      saving: false,
      activeCase: null,
      activeSimulationId: null,
      workspaceView: 'simulation',
      uiView: 'simulation',
      isDirty: false,
      liveZoneDetails: {},
      lastUserScrollAt: 0,
      scrollRestoreFrame: null,
      scrollRestoreUntil: 0,
      run: {
        commands: [],
        result: null,
        sampleIndex: 0,
        timer: null,
        playing: false,
        playbackConfigured: false,
        durationMode: 'FIXED',
        configuration: null
      }
    };

    var charts = STCharts(state,formatNumber);
    var drawSimulationChart = charts.drawSimulationChart, drawEquipmentSpeedChart = charts.drawEquipmentSpeedChart, drawEquipmentSpeedSparkline = charts.drawEquipmentSpeedSparkline;
    var renderCaseComparison = STComparison(state,isFiniteNumber).render;
    var assistant = STAssistant(state);
    var sheetImport = STSheetImport(state,{apply:applySheetImport,capture:captureSheetImport});
    var shell = STShell(state,{assistant:assistant.sync,signout:lockWorkspace,navigate:navigateView,home:showCaseHome,save:saveActiveCase,cases:function(){renderCases(state.bootstrap?.cases||[]);},redraw:renderPlaybackFrame});
    function navigateView(view) {
      if (!state.activeCase) return;
      state.uiView = view;
      if (view === 'comparison') showCaseComparison();
      else { state.workspaceView = 'simulation'; renderWorkspaceTabs(); }
      shell.sync(); renderPlaybackFrame();
    }

    document.addEventListener('DOMContentLoaded', function() {
      bindEvents();
      assistant.init();
      sheetImport.init();
      shell.init();
      if (STPreferences.read('remember') === 'yes') {
        document.getElementById('remember-session').checked = true;
        signIn();
      }
    });
    window.addEventListener('resize', function() { renderPlaybackFrame(); });
    window.addEventListener('scroll', function() {
      if (Date.now() >= state.scrollRestoreUntil) state.lastUserScrollAt = Date.now();
    }, { passive: true });

    function bindEvents() {
      document.getElementById('sign-in-form').addEventListener('submit', function(event) { event.preventDefault(); signIn(); });
      document.getElementById('sign-out').addEventListener('click', lockWorkspace);
      document.getElementById('home-cases').addEventListener('click', showCaseHome);
      document.getElementById('open-settings').addEventListener('click', STSettings.open);
      document.getElementById('show-new-case').addEventListener('click', function() {
        toggle('new-case-form', true); document.getElementById('new-case-name').focus();
      });
      document.getElementById('case-search').addEventListener('input', function() { renderCases(state.bootstrap ? state.bootstrap.cases : []); });
      document.getElementById('workspace-form').addEventListener('submit', saveWorkspace);
      document.getElementById('new-case-form').addEventListener('submit', createDraftCase);
      document.getElementById('create-public-demo-case').addEventListener('click', createPublicDemoCase);
      document.getElementById('reload-case').addEventListener('click', reloadActiveCase);
      document.getElementById('clone-case').addEventListener('click', cloneActiveSimulation);
      document.getElementById('delete-case').addEventListener('click', deleteActiveCase);
      document.getElementById('save-case').addEventListener('click', saveActiveCase);
      document.getElementById('add-equipment').addEventListener('click', addEquipment);
      document.getElementById('case-editor-form').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('change', markCaseDirty);
      document.getElementById('add-control-event').addEventListener('click', addControlEvent);
      document.getElementById('run-simulation').addEventListener('click', runSimulation);
      document.getElementById('play-simulation').addEventListener('click', startPlayback);
      document.getElementById('pause-simulation').addEventListener('click', pausePlayback);
      document.getElementById('reset-playback').addEventListener('click', resetPlayback);
      document.getElementById('duration-mode').addEventListener('change', function(event) {
        state.run.durationMode = event.target.value;
      });
    }

    function signIn() {
      document.getElementById('sign-in-button').disabled = true;
      document.getElementById('auth-status').textContent = __ST_TEXT__('client.verifying_your_google_access');
      initialize();
    }

    function showCaseHome() {
      if(state.saving){setStatus(__ST_TEXT__('client.saving_your_changes'));return false;}
      if (state.isDirty && !window.confirm(__ST_TEXT__('client.discard_unsaved_changes_and_return_to_cases'))) return false;
      state.openSequence += 1;
      stopPlaybackTimer();
      sheetImport.close();
      state.activeCase = null;
      state.run.result = null;
      state.isDirty = false;
      ['editor-panel', 'run-panel', 'comparison-panel', 'workspace-tabs', 'engine-panel'].forEach(function(id) { toggle(id, false); });
      var connected = Boolean(state.bootstrap && state.bootstrap.settings.workspaceRootFolderId);
      toggle('cases-panel', connected);
      shell.sync();
      return true;
    }

    function lockWorkspace() {
      if (!showCaseHome()) return;
      state.requestEpoch += 1;
      STPreferences.write('remember', null);
      document.getElementById('remember-session').checked = false;
      state.bootstrap = null;
      assistant.reset();
      document.getElementById('cases-list').textContent = '';
      toggle('application', false); toggle('auth-panel', true);
      document.getElementById('auth-status').textContent = __ST_TEXT__('client.signed_out_of_line_studio_your_google_account_remains_signed_in');
      document.getElementById('sign-in-button').focus();
    }

    function initialize() {
      setStatus(__ST_TEXT__('client.loading_console'));
      callServer('getBootstrap', [], renderBootstrap);
    }

    function renderBootstrap(response) {
      if (!response.ok) return showError(response.error);
      document.getElementById('sign-in-button').disabled = false;
      document.getElementById('auth-status').textContent = '';
      STPreferences.write('remember', document.getElementById('remember-session').checked ? 'yes' : null);
      toggle('auth-panel', false); toggle('application', true);
      state.bootstrap = response.data;
      STSettings.configureGemini(response.data.gemini || {});
      document.getElementById('user-email').textContent = response.data.user.email;
      document.getElementById('workspace-folder-id').value = response.data.settings.workspaceRootFolderId || '';
      document.getElementById('playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
      if (!state.run.playbackConfigured) {
        document.getElementById('run-playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
        state.run.playbackConfigured = true;
      }

      var hasWorkspace = Boolean(response.data.settings.workspaceRootFolderId);
      document.getElementById('workspace-panel').classList.remove('hidden');
      toggle('cases-panel', hasWorkspace && !state.activeCase);
      toggle('engine-panel', false);
      renderCases(response.data.cases);
      setStatus(state.activeCase ? '' : (hasWorkspace ? '' : __ST_TEXT__('client.open_settings_to_connect_a_drive_folder_before_creating_a_case')));
      shell.sync();
    }

    function saveWorkspace(event) {
      event.preventDefault();
      STSettings.setSaving(true);
      callServer('saveUserSettings', [{
        workspaceRootFolderId: document.getElementById('workspace-folder-id').value,
        preferredPlaybackRate: Number(document.getElementById('playback-rate').value),
        gemini: {model:document.getElementById('gemini-model').value,apiKey:document.getElementById('gemini-api-key').value,clearKey:document.getElementById('gemini-clear-key').checked}
      }], function(response) {
        STSettings.setSaving(false);
        if (!response.ok) return STSettings.error(response.error.message || __ST_TEXT__('client.settings_could_not_be_saved'));
        STSettings.saved();
        shell.toast(__ST_TEXT__('client.settings_saved'));
        initialize();
      });
    }

    function createDraftCase(event) {
      event.preventDefault();
      var input = document.getElementById('new-case-name');
      setBusy('new-case-form', true);
      callServer('createCase', [{ name: input.value }], function(response) {
        setBusy('new-case-form', false);
        if (!response.ok) return showError(response.error);
        input.value = '';
        toggle('new-case-form', false);
        openCase(response.data.id);
        initialize();
      });
    }

    

function createPublicDemoCase() {
      setBusy('create-public-demo-case', true);
      callServer('createPublicDemoCase', [], function(response) {
        setBusy('create-public-demo-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function deleteActiveCase() {
      if (!state.activeCase) return;
      requestCaseDeletion(state.activeCase.id, state.activeCase.name, document.getElementById('delete-case'));
    }

    function requestCaseDeletion(caseId, caseName, button) {
      if (!window.confirm(__ST_TEXT__('client.move_case') + caseName + __ST_TEXT__('client.to_the_drive_trash'))) return;
      if (button) button.disabled = true;
      callServer('deleteCase', [caseId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        var deletedActiveCase = state.activeCase && state.activeCase.id === caseId;
        if (deletedActiveCase) {
          stopPlaybackTimer();
          state.activeCase = null;
          state.isDirty = false;
          state.run.commands = [];
          state.run.result = null;
          state.run.configuration = null;
          state.liveZoneDetails = {};
          toggle('editor-panel', false);
          toggle('run-panel', false);
        }
        initialize();
        setStatus(__ST_TEXT__('client.case_moved_to_drive_trash'));
      });
    }

function openCase(caseId) {
      if (state.isDirty && !window.confirm(__ST_TEXT__('client.discard_unsaved_changes_and_open_this_case'))) return;
      var sequence = ++state.openSequence;
      callServer('getCase', [caseId], function(response) {
        if(sequence !== state.openSequence) return;
        if (!response.ok) return showError(response.error);
        stopPlaybackTimer();
        state.activeCase = response.data;
        toggle('cases-panel', false);

        state.isDirty = false;
        state.workspaceView = 'simulation';
        state.uiView = 'simulation';
        state.liveZoneDetails = {};
        state.run.commands = [];
        state.run.result = null;
        state.run.configuration = null;
        initializePersistentSimulations();
        renderEditor();
        setStatus(__ST_TEXT__('client.case_loaded'));
      });
    }

    function reloadActiveCase() {
      if (!state.activeCase) return;
      openCase(state.activeCase.id);
    }

    function cloneActiveSimulation() {
      if (!state.activeCase) return;
      saveActiveCase(function() {
        cloneSavedActiveSimulation();
      });
    }

    function cloneSavedActiveSimulation(afterClone) {
      if (!state.activeCase) return;
      var button = document.getElementById('clone-case');
      if (button) button.disabled = true;
      callServer('cloneSimulation', [state.activeCase.id, state.activeSimulationId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.activeSimulationId = response.data.simulations[response.data.simulations.length - 1].id;
        if (typeof afterClone === 'function') {
          afterClone(activePersistentSimulation());
          return;
        }
        renderWorkspaceTabs();
        activatePersistentSimulation(state.activeSimulationId);
        setStatus(__ST_TEXT__('client.active_simulation') + activePersistentSimulation().name + __ST_TEXT__('client.this_is_a_clone_the_source_remains_unchanged'));
      });
    }

    function markCaseDirty() {
      if (!state.activeCase) return;
      state.isDirty = true;
      renderEditorMeta();
      renderRunWorkspace();
    }

    function saveActiveCase(afterSave) {
      var next = collectCaseEditor();
      if (!next) return;
      var simulation = activePersistentSimulation();
      if (simulation) {
        simulation.equipment = cloneJson(next.equipment || []);
        simulation.dynamicConfig = cloneJson(readRunConfiguration() || simulation.dynamicConfig || {});
        next.simulations = cloneJson(state.activeCase.simulations || []);
      }
      if(state.saving) return;
      state.saving=true; shell.sync();
      setBusy('save-case', true);
      callServer('saveCase', [next], function(response) {
        state.saving=false; shell.sync();
        setBusy('save-case', false);
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.isDirty = false;
        renderEditor();
        initialize();
        if (typeof afterSave === 'function') afterSave(response.data);
        else setStatus(__ST_TEXT__('client.case_saved_as_revision') + response.data.revision + '.');
      });
    }

    function captureSheetImport() {
      var editor=collectCaseEditor();
      if (!editor) return null;
      return {equipment:cloneJson(editor.equipment),sourceImport:cloneJson(activePersistentSimulation()?.sourceImport||{})};
    }

    function applySheetImport(result) {
      var simulation=activePersistentSimulation();
      if (!state.activeCase || !simulation || state.saving || result.errors.length || !result.hasChanges) return false;
      syncPersistentSimulation();
      simulation.sourceImport=cloneJson(result.sourceImport);
      if(result.equipmentChanged){
        stopPlaybackTimer();
        state.activeCase.equipment=cloneJson(result.equipment);
        simulation.equipment=cloneJson(result.equipment);
        simulation.results=null;
        state.run.result=null;state.run.configuration=null;state.run.sampleIndex=0;
        document.getElementById('simulation-json-preview').value='';
        STResults.render(null,state.activeCase);
      }
      state.activeCase.metadata=Object.assign({},state.activeCase.metadata,{dataClassification:'USER_PROVIDED'});
      state.isDirty=true;state.uiView='editor';
      renderEditor();shell.sync();
      setStatus(__ST_TEXT__('client.applied_sheet_selection_to')+simulation.name+': '+result.added+__ST_TEXT__('client.added')+result.updated+__ST_TEXT__('client.updated_save_the_case')+(result.equipmentChanged?__ST_TEXT__('client.run_again_to_refresh_results'):''));
      return true;
    }

    function addEquipment() {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.push(createBlankEquipment());
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function renderCases(cases) { STCaseGallery.render(cases, openCase, requestCaseDeletion); }

    function renderEditor() {
      if (!state.activeCase) return;
      toggle('editor-panel', true);
      var activeSimulation = activePersistentSimulation();
      document.getElementById('editor-title').textContent = state.activeCase.name + (activeSimulation ? ' · ' + activeSimulation.name : '');
      document.getElementById('case-name').value = state.activeCase.name;
      document.getElementById('unit-of-flow').value = state.activeCase.unitOfFlow || '';
      renderEditorMeta();
      renderCaseDataNote();
      renderEquipment();
      renderRawJson();
      renderRunWorkspace();
    }

    function renderEditorMeta() {
      if (!state.activeCase) return;
      var dirtyText = state.isDirty ? __ST_TEXT__('client.unsaved_changes') : '';
      var activeSimulation = activePersistentSimulation();
      var scenarioText = activeSimulation && activeSimulation.scenario && activeSimulation.scenario.title
        ? __ST_TEXT__('client.what_if') + activeSimulation.scenario.title
        : '';
      shell.sync();
      document.getElementById('editor-meta').textContent = __ST_TEXT__('client.id') + state.activeCase.id + __ST_TEXT__('client.active') + (activeSimulation ? activeSimulation.name : '—') + scenarioText + __ST_TEXT__('client.revision') + state.activeCase.revision + dirtyText;
    }

    function renderCaseDataNote() {
      var target = document.getElementById('case-data-note');
      var metadata = state.activeCase && state.activeCase.metadata ? state.activeCase.metadata : {};
      var source=activePersistentSimulation()?.sourceImport;
      var note = source?.source ? __ST_TEXT__('client.imported_from')+source.source.sheetName+' · '+source.source.readAt+__ST_TEXT__('client.mtbf_drives_random_failure_intervals_mttr_is_a_fixed_repair_duration_review') : typeof metadata.dataNote === 'string' ? metadata.dataNote : '';
      target.textContent = note;
      toggle('case-data-note', Boolean(note));
    }

    function renderEquipment() {
      var target = document.getElementById('equipment-list');
      target.textContent = '';
      state.activeCase.equipment.forEach(function(equipment, index) {
        target.appendChild(createEquipmentCard(equipment, index));
      });
      if (!state.activeCase.equipment.length) {
        target.innerHTML = ("<p class=\"empty\">" + __ST_HTML_TEXT__('client.this_draft_has_no_equipment_add_at_least_two_units_before_simulation_2') + "</p>");
      }
      renderRawJson();
    }

    function createEquipmentCard(equipment, index) {
      var card = document.createElement('article');
      card.className = 'equipment-card';
      card.dataset.index = String(index);
      card.innerHTML = ("<div class=\"equipment-header\"><strong></strong><div class=\"button-row\"><button class=\"equipment-drag ghost icon-button\" type=\"button\" aria-label=\"" + __ST_HTML_TEXT__('client.reorder_equipment') + "\" title=\"" + __ST_HTML_TEXT__('client.drag_to_reorder_use_arrow_up_or_down_on_this_handle') + "\"></button><button class=\"remove-equipment danger\" type=\"button\">" + __ST_HTML_TEXT__('client.remove') + "</button></div></div><div class=\"equipment-grid\"><label>" + __ST_HTML_TEXT__('client.equipment_id') + "<input class=\"equipment-id\"></label><label>" + __ST_HTML_TEXT__('sheetimportmerge.type') + "<select class=\"equipment-type\"><option value=\"BLOWER\">" + __ST_HTML_TEXT__('client.blower') + "</option><option value=\"BLOWMOLDER\">" + __ST_HTML_TEXT__('client.blowmolder') + "</option><option value=\"CONVEYOR\">" + __ST_HTML_TEXT__('client.conveyor') + "</option><option value=\"PACEMAKER\">" + __ST_HTML_TEXT__('client.pacemaker') + "</option><option value=\"PUCKER\">" + __ST_HTML_TEXT__('client.pucker') + "</option><option value=\"FILLER\">" + __ST_HTML_TEXT__('client.filler') + "</option><option value=\"DEPUCKER\">" + __ST_HTML_TEXT__('client.de_pucker') + "</option><option value=\"SLEEVER\">" + __ST_HTML_TEXT__('client.sleever') + "</option><option value=\"CASE_PACKER\">" + __ST_HTML_TEXT__('client.case_packer') + "</option><option value=\"PALLETIZER\">" + __ST_HTML_TEXT__('client.palletizer') + "</option><option value=\"CUSTOM\">" + __ST_HTML_TEXT__('client.other_custom') + "</option></select></label><label>" + __ST_HTML_TEXT__('sheetimportmerge.name') + "<input class=\"equipment-name\"></label><label>" + __ST_HTML_TEXT__('client.nominal_rate_sec') + "<input class=\"equipment-rate\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.initial_mode') + "<select class=\"equipment-mode\"><option value=\"AUTO\">" + __ST_HTML_TEXT__('client.automatic') + "</option><option value=\"MANUAL\">" + __ST_HTML_TEXT__('client.manual') + "</option><option value=\"PAUSE\">" + __ST_HTML_TEXT__('client.paused') + "</option><option value=\"STOP\">" + __ST_HTML_TEXT__('client.stopped') + "</option></select></label></div><section class=\"format-zone-setup\"><div class=\"format-zone-heading\"><div><strong>" + __ST_HTML_TEXT__('client.flowpilot_conveyor_design') + "</strong><p>" + __ST_HTML_TEXT__('client.required_for_every_conveyor_geometry_is_always_active_the_engine_derives_co') + "</p></div></div><div class=\"format-zone-grid\"><label>" + __ST_HTML_TEXT__('client.installed_length_l_act_mm') + "<input class=\"format-zone-lact\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.prime_reserve_l_p_mm') + "<input class=\"format-zone-lp-prime\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('sheetimportmerge.package_length_mm') + "<input class=\"format-zone-package-length\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.upstream_discharge_pitch_mm') + "<input class=\"format-zone-discharge-pitch\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.conveyor_speed_factor') + "<input class=\"format-zone-speed-factor\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.installed_back_up_position_mm') + "<input class=\"format-zone-backup\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.discharge_runout_mm') + "<input class=\"format-zone-discharge-runout\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.reject_runout_mm') + "<input class=\"format-zone-reject-runout\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.blocked_time_delay_s') + "<input class=\"format-zone-blocked-delay\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.clear_time_delay_s') + "<input class=\"format-zone-clear-delay\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.insurance_factor_units') + "<input class=\"format-zone-insurance\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.upstream_stop_response_s') + "<input class=\"format-zone-stop-response\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('sheetimportmerge.bottles_discharged_at_stop') + "<input class=\"format-zone-residual\" type=\"number\" min=\"0\" step=\"any\"></label><label>" + __ST_HTML_TEXT__('client.downstream_ramp_up_s') + "<input class=\"format-zone-downstream-ramp\" type=\"number\" min=\"0\" step=\"any\"></label></div><p class=\"format-zone-preview\"></p></section><details class=\"equipment-json-details\"><summary>" + __ST_HTML_TEXT__('client.advanced_json_fields') + "</summary><label class=\"characteristics-label\">" + __ST_HTML_TEXT__('client.characteristics_json_optional') + "<textarea class=\"equipment-characteristics\" spellcheck=\"false\"></textarea></label><label class=\"characteristics-label\">" + __ST_HTML_TEXT__('client.noise_profile_json_optional') + "<textarea class=\"equipment-noise-profile\" spellcheck=\"false\"></textarea></label><label class=\"characteristics-label\">" + __ST_HTML_TEXT__('client.advanced_process_format_json_optional') + "<textarea class=\"equipment-process-data\" spellcheck=\"false\"></textarea></label></details>");
      card.querySelector('strong').textContent = __ST_TEXT__('client.step') + (index + 1) + ' · ' + (equipment.type || 'CUSTOM') + ' · ' + (equipment.name || equipment.id || 'Unnamed') + ' · ' + (Number(equipment.nominalRatePerSecond || 0) * 60) + __ST_TEXT__('client.bpm');
      card.querySelector('.equipment-id').value = equipment.id || '';
      card.querySelector('.equipment-type').value = equipment.type || 'CUSTOM';
      card.querySelector('.equipment-name').value = equipment.name || '';
      card.querySelector('.equipment-rate').value = equipment.nominalRatePerSecond === undefined ? '' : equipment.nominalRatePerSecond;
      card.querySelector('.equipment-mode').value = equipment.initialMode || 'AUTO';
      card.querySelector('.equipment-characteristics').value = JSON.stringify(equipment.characteristics || {}, null, 2);
      card.querySelector('.equipment-noise-profile').value = JSON.stringify(equipment.noiseProfile || {}, null, 2);
      card.querySelector('.equipment-process-data').value = JSON.stringify(equipment.processData || {}, null, 2);

      applyConceptTooltips(card);
      populateFormatZoneInputs(card, equipment);
      updateFormatZoneVisibility(card);
      renderFormatZonePreview(card);

      STEquipmentDrag.bind(card,index,moveEquipment);
      var remove=card.querySelector('.remove-equipment');remove.innerHTML=STIcons.svg('trash');remove.classList.add('icon-button');remove.title=__ST_TEXT__('client.delete_equipment');remove.setAttribute('aria-label',__ST_TEXT__('client.delete_equipment'));
      card.querySelector('.remove-equipment').addEventListener('click', function() { removeEquipment(index); });
      var collapse = document.createElement('button');
      collapse.type = 'button'; collapse.className = 'toggle-step secondary'; collapse.innerHTML = STIcons.svg('edit'); collapse.classList.add('icon-button');collapse.title=__ST_TEXT__('client.edit_equipment');collapse.setAttribute('aria-label',__ST_TEXT__('client.edit_equipment')); collapse.setAttribute('aria-expanded','false');
      collapse.addEventListener('click', function() { card.classList.toggle('equipment-card-expanded'); collapse.title=card.classList.contains('equipment-card-expanded')?__ST_TEXT__('client.collapse_details'):__ST_TEXT__('client.edit_equipment');collapse.setAttribute('aria-label',collapse.title); collapse.setAttribute('aria-expanded',String(card.classList.contains('equipment-card-expanded'))); });
      card.querySelector('.equipment-header .button-row').prepend(collapse);
      card.querySelector('.equipment-type').addEventListener('change', function() {
        updateFormatZoneVisibility(card);
        renderFormatZonePreview(card);
      });
      Array.prototype.slice.call(card.querySelectorAll('.format-zone-grid input')).forEach(function(input) {
        input.addEventListener('input', function() {
          state.isDirty = true;
          renderFormatZonePreview(card);
        });
      });
      return card;
    }

    function applyConceptTooltips(card) {
      var concepts = [
        ['.format-zone-lact', __ST_TEXT__('client.total_installed_conveyor_length_measured_from_the_upstream_discharge_toward')],
        ['.format-zone-lp-prime', __ST_TEXT__('client.reserved_downstream_length_between_the_prime_photocell_and_the_downstream_m')],
        ['.format-zone-package-length', __ST_TEXT__('client.physical_package_length_in_the_direction_of_travel_it_determines_the_photoe')],

    function appendZoneMetric(host, labelText, valueClass, tooltip) {
      if (!host) return;
      var cell = document.createElement('div');
      var label = document.createElement('span');
      var value = document.createElement('b');
      label.textContent = labelText;
      label.title = tooltip;
      value.className = valueClass;
      cell.appendChild(label);
      cell.appendChild(value);
      host.appendChild(cell);
    }

    function applyZoneConceptTooltips(panel) {
      setZoneMetricTooltip(panel, '.zone-inventory', __ST_TEXT__('client.all_material_on_this_physical_conveyor_in_transit_plus_waiting'));
      setZoneMetricTooltip(panel, '.zone-transit', __ST_TEXT__('client.product_moving_between_the_upstream_discharge_and_the_downstream_end_of_the'));
      setZoneMetricTooltip(panel, '.zone-prime', __ST_TEXT__('client.prime_photocell_signal_a_product_pass_authorizes_the_downstream_start_a_blo'));
      setZoneMetricTooltip(panel, '.zone-backup', __ST_TEXT__('client.back_up_photocell_signal_only_a_continuously_blocked_signal_starts_the_stop'));
      setZoneMetricTooltip(panel, '.zone-geometry', __ST_TEXT__('client.installed_usable_length_and_effective_product_pitch_used_to_calculate_physi'));
      setZoneMetricTooltip(panel, '.zone-travel', __ST_TEXT__('client.nominal_time_for_material_to_travel_through_the_physical_conveyor'));
      setZoneMetricTooltip(panel, '.zone-overflow', __ST_TEXT__('client.material_that_could_not_enter_a_full_physical_zone'));
      setZoneMetricTooltip(panel, '.zone-overflow-length', __ST_TEXT__('client.required_overflow_length_including_runout_residual_discharge_blocked_delay_'));
      setZoneMetricTooltip(panel, '.zone-accumulation-length', __ST_TEXT__('client.usable_accumulation_length_after_reserving_prime_and_required_overflow_spac'));
      setZoneMetricTooltip(panel, '.zone-recovery-length', __ST_TEXT__('client.calculated_recovery_margin_after_back_up_clears_positive_values_indicate_a_'));
      setZoneMetricTooltip(panel, '.zone-anti-starve', __ST_TEXT__('client.time_the_useful_accumulation_can_continue_feeding_the_downstream_critical_m'));
      setZoneMetricTooltip(panel, '.zone-anti-block', __ST_TEXT__('client.time_the_useful_accumulation_can_accept_upstream_output_before_the_upstream'));
      setZoneMetricTooltip(panel, '.zone-recommended-speed', __ST_TEXT__('client.minimum_downstream_infeed_conveyor_speed_with_the_worksheet_5_overspeed_mar'));
    }

    function setZoneMetricTooltip(panel, valueSelector, tooltip) {
      var value = panel.querySelector(valueSelector);
      var label = value && value.parentElement && value.parentElement.querySelector('span');
      if (label) label.title = tooltip;
    }

    function updateAccumulationZonePanel(panel, zone) {
      panel.className = 'accumulation-zone state-' + String(zone.state || 'EMPTY').toLowerCase().replace(/_/g, '-');
      var geometry = zone.geometry || {};
      panel.querySelector('strong').textContent = zone.name || __ST_TEXT__('client.accumulation_zone');
      panel.querySelector('.accumulation-zone-heading span').textContent = String(zone.state || 'EMPTY').replace(/_/g, ' ');
      panel.querySelector('.zone-inventory').textContent = formatNumber(zone.inventoryUnits) + ' / ' + formatNumber(zone.capacityUnits) + ' (' + formatNumber(zone.fillPercent) + '%)';
      panel.querySelector('.zone-transit').textContent = formatNumber(zone.inTransitUnits);
      panel.querySelector('.zone-waiting').textContent = formatNumber(zone.waitingUnits);
      panel.querySelector('.zone-prime').textContent = formatPrimeSensorReading(zone.prime);
      panel.querySelector('.zone-backup').textContent = formatBackupSensorReading(zone.backup);
      panel.querySelector('.zone-geometry').textContent = geometry.usableLengthMm && geometry.productPitchMm
        ? formatNumber(geometry.usableLengthMm) + __ST_TEXT__('client.mm_3') + formatNumber(geometry.productPitchMm) + __ST_TEXT__('client.mm_2')
        : __ST_TEXT__('client.not_available');
      panel.querySelector('.zone-travel').textContent = geometry.travelSeconds > 0
        ? formatNumber(geometry.travelSeconds) + ' s'
        : '—';
      panel.querySelector('.zone-sensor-timing').textContent = formatSensorTiming(geometry);
      panel.querySelector('.zone-overflow').textContent = formatNumber(zone.overflowUnits);
      panel.querySelector('.zone-caption').textContent = zoneOriginLabel(zone.modelOrigin) + __ST_TEXT__('client.capacity_floor_length_pitch') +
        formatNumber(zone.capacityUnits) + __ST_TEXT__('client.units_controls_upstream') + zone.upstreamControlEquipmentId +
        __ST_TEXT__('client.starts_downstream') + zone.downstreamControlEquipmentId;
      panel.querySelector('.zone-assumptions').textContent = summarizeGeometrySources(zone.geometrySources, zone.formatAssumptions);
      updateZoneEngineeringAudit(panel, zone);
    }

    function formatPrimeSensorReading(prime) {
      if (!prime || !prime.configured) return __ST_TEXT__('client.not_configured');
      if (prime.state === 'PULSING') return __ST_TEXT__('client.pulsing_product_passing');
      if (prime.state === 'BLOCKED') return __ST_TEXT__('client.blocked_queue_present');
      return prime.latched ? __ST_TEXT__('client.clear_start_sent') : __ST_TEXT__('client.clear_waiting');
    }

    function formatBackupSensorReading(backup) {
      if (!backup || !backup.configured) return __ST_TEXT__('client.not_configured');
      if (backup.state === 'PULSING') return __ST_TEXT__('client.pulsing_normal_flow');
      if (backup.state === 'BLOCKED') {
        return backup.controlActive
          ? __ST_TEXT__('client.blocked_control_active')
          : __ST_TEXT__('client.blocked') + formatSeconds(backup.blockedCandidateSeconds) + ' / ' + formatSeconds(backup.blockedTimeDelaySeconds);
      }
      if (backup.controlActive && backup.clearCandidateSeconds > 0) {
        return __ST_TEXT__('client.clear') + formatSeconds(backup.clearCandidateSeconds) + ' / ' + formatSeconds(backup.clearTimeDelaySeconds);
      }
      return backup.controlActive ? __ST_TEXT__('client.clear_awaiting_delay') : 'CLEAR';
    }

    function formatSensorTiming(geometry) {
      if (!geometry) return '—';
      var pulse = formatSeconds(geometry.packagePassSensorSeconds);
      var gap = formatSeconds(geometry.sensorClearGapSeconds);
      return pulse === '—' && gap === '—' ? '—' : pulse + ' / ' + gap;
    }

    function zoneOriginLabel(origin) {
      return origin === 'FLOWPILOT_ENGINEERING'
        ? __ST_TEXT__('client.flowpilot_physical_conveyor_zone')
        : origin === 'FORMAT_GEOMETRY' ? __ST_TEXT__('client.direct_physical_conveyor_zone') : __ST_TEXT__('client.physical_zone');
    }

    function updateZoneEngineeringAudit(panel, zone) {
      var host = panel.querySelector('.zone-engineering');
      var engineering = state.run.result?.accumulationZoneMetrics?.[zone.id]?.engineering;
      if (!engineering || !engineering.calculated || !engineering.audit) {
        host.classList.add('hidden');
        return;
      }
      host.classList.remove('hidden');
      var calculated = engineering.calculated;
      host.querySelector('.zone-audit-status').textContent = String(engineering.audit.status || 'NOT_EVALUATED').replace(/_/g, ' ');
      host.querySelector('.zone-audit-status').className = 'zone-audit-status audit-' + String(engineering.audit.status || 'NOT_EVALUATED').toLowerCase().replace(/_/g, '-');
      host.querySelector('.zone-overflow-length').textContent = engineeringNumber(calculated.overflowLengthMm, __ST_TEXT__('client.mm_2'));
      host.querySelector('.zone-accumulation-length').textContent = engineeringNumber(calculated.usefulAccumulationLengthMm, __ST_TEXT__('client.mm_2'));
      host.querySelector('.zone-recovery-length').textContent = engineeringNumber(calculated.recoveryLengthMm, __ST_TEXT__('client.mm_2'));
      host.querySelector('.zone-anti-starve').textContent = engineeringNumber(calculated.antiStarveSeconds, ' s');
      host.querySelector('.zone-anti-block').textContent = engineeringNumber(calculated.antiBlockSeconds, ' s');
      host.querySelector('.zone-recommended-speed').textContent = engineeringNumber(calculated.recommendedInfeedConveyorSpeedMmPerSecond, __ST_TEXT__('client.mm_s_2'));
      host.querySelector('.zone-sensor-pulse').textContent = engineeringNumber(calculated.packagePassSensorSeconds, ' s');
      host.querySelector('.zone-sensor-gap').textContent = engineeringNumber(calculated.sensorClearGapSeconds, ' s');
      host.querySelector('.zone-insurance').textContent = engineeringNumber(engineering.input.insuranceFactorUnits, __ST_TEXT__('client.units'));
      host.querySelector('.zone-audit-goals').textContent = engineering.audit.goals.map(function(goal) {
        return goal.id.replace(/_/g, ' ') + ': ' + goal.status.replace(/_/g, ' ') + ' — ' + goal.message;
      }).join(' · ');
    }

    function engineeringNumber(value, suffix) {
      return isFiniteNumber(value) ? formatNumber(value) + suffix : '—';
    }

function summarizeGeometrySources(sources, assumptions) {
      var details = [];
      if (sources && sources.productPitchMm) details.push(__ST_TEXT__('client.pitch') + sources.productPitchMm);
      if (sources && sources.conveyorSpeedMmPerSecond) details.push(__ST_TEXT__('client.speed') + sources.conveyorSpeedMmPerSecond);
      if (!details.length && Array.isArray(assumptions) && assumptions.length) details.push(assumptions[0]);
      return details.join(' · ');
    }

    function bindLiveEquipmentControl(button, equipmentId, action) {
      button.addEventListener('click', function() {
        applyLiveScenarioControl(equipmentId, action);
      });
    }

    function updateLiveEquipmentControl(button) {
      var sample = state.run.result && state.run.result.samples[state.run.sampleIndex];
      var isAtRunEnd = !sample || sample.virtualSecond >= state.run.result.durationSeconds;
      button.disabled = isAtRunEnd;
      button.title = (button.dataset.actionLabel || '') + ' — ' + (isAtRunEnd
        ? __ST_TEXT__('client.reset_playback_to_an_earlier_virtual_time_before_applying_a_scenario_contro')
        : __ST_TEXT__('client.apply_at_the_displayed_virtual_second_and_recalculate_this_simulation_scena'));
    }

    function applyLiveScenarioControl(equipmentId, action) {
      if (!state.run.result) return;
      var sample = state.run.result.samples[state.run.sampleIndex];
      if (!sample || sample.virtualSecond >= state.run.result.durationSeconds) {
        return setStatus(__ST_TEXT__('client.reset_playback_to_an_earlier_virtual_time_before_applying_a_scenario_contro'));
      }

      var wasPlaying = state.run.playing;
      var actions = action === 'RESET_AND_RUN' ? ['RESET', 'RUN'] : [action];
      actions.forEach(function(nextAction) {
        state.run.commands.push({
          atVirtualSecond: sample.virtualSecond,
          equipmentId: equipmentId,
          action: nextAction
        });
      });
      renderControlEvents();

      var run = createStoredRunConfiguration();
      if (!run || !calculateSimulation(run, sample.virtualSecond)) return;
      var equipment = state.activeCase.equipment.find(function(item) { return item.id === equipmentId; });
      var label = equipment ? equipment.name : equipmentId;
      setStatus((action === 'RESET_AND_RUN' ? __ST_TEXT__('client.reset_and_run') : action.replace(/_/g, ' ').toLowerCase()) + __ST_TEXT__('client.scheduled_for') + label + __ST_TEXT__('client.at_virtual') + sample.virtualSecond + __ST_TEXT__('client.s_the_deterministic_path_was_recalculated'));
      if (wasPlaying) startPlayback();
    }

    function setPlaybackStatus(message) {
      var target = document.getElementById('playback-status');
      if (target) target.textContent = message;
    }

    function sum(values) {
      return values.reduce(function(total, value) { return total + value; }, 0);
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function formatSeconds(value) {
      return isFiniteNumber(value) ? formatNumber(value) + ' s' : '—';
    }

    function formatRatePerMinute(ratePerSecond) {
      return formatNumber(Number(ratePerSecond || 0) * 60) + __ST_TEXT__('client.min_3');
    }

    function formatPercent(value) {
      return isFiniteNumber(value) ? formatNumber(value * 100) + '%' : '—';
    }

    function formatMinutes(seconds) {
      return formatNumber(Number(seconds || 0) / 60) + __ST_TEXT__('client.min');
    }

    function callServer(name, args, onSuccess) {
      var epoch = state.requestEpoch;
      state.pendingRequests += 1;
      document.getElementById('request-progress').classList.remove('hidden');
      function done() {
        state.pendingRequests = Math.max(0,state.pendingRequests-1);
        document.getElementById('request-progress').classList.toggle('hidden',state.pendingRequests===0);
      }
      var runner = google.script.run
        .withFailureHandler(function() {
          done();
          if(epoch !== state.requestEpoch) return;
          state.saving=false;
          document.querySelectorAll('[data-busy="true"]').forEach(function(button){button.disabled=false;delete button.dataset.busy;});
          shell.sync();
          showError({ code: 'NETWORK_ERROR', message: __ST_TEXT__('client.the_server_request_could_not_be_completed_please_try_again') });
        })
        .withSuccessHandler(function(response) { done(); if(epoch === state.requestEpoch) onSuccess(response); });
      runner[name].apply(runner, args);
    }

    function toggle(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }
    function setStatus(message) { var target = document.getElementById('status'); target.className = 'status'; target.textContent = message; }
    function showError(error) {
      var message = (error.code || 'ERROR') + ': ' + (error.message || __ST_TEXT__('client.the_request_failed'));
      var target = document.getElementById('status'); target.className = 'status error'; target.textContent = message;
      document.getElementById('auth-status').textContent = message;
      document.getElementById('sign-in-button').disabled = false;
      if (document.getElementById('settings-dialog').open) STSettings.error(message);
    }
    function setBusy(targetId, busy) { var target = document.getElementById(targetId); var button = target.tagName === 'FORM' ? target.querySelector('button') : target; button.disabled = busy; button.dataset.busy=String(busy); button.setAttribute("aria-busy",String(busy)); }
  })();
</script>
