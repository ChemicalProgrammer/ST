<script>
  (function() {
    var state = {
      bootstrap: null,
      requestEpoch: 0,
      pendingRequests: 0,
      openSequence: 0,
      saving: false,
      activeCase: null,
      activeSimulationId: null,
      workspaceView: 'simulation',
      uiView: 'simulation',
      isDirty: false,
      liveZoneDetails: {},
      lastUserScrollAt: 0,
      scrollRestoreFrame: null,
      scrollRestoreUntil: 0,
      run: {
        commands: [],
        result: null,
        sampleIndex: 0,
        timer: null,
        playing: false,
        playbackConfigured: false,
        durationMode: 'FIXED',
        configuration: null
      }
    };

    var charts = STCharts(state,formatNumber);
    var drawSimulationChart = charts.drawSimulationChart, drawEquipmentSpeedChart = charts.drawEquipmentSpeedChart, drawEquipmentSpeedSparkline = charts.drawEquipmentSpeedSparkline;
    var renderCaseComparison = STComparison(state,isFiniteNumber).render;
    var assistant = STAssistant(state);
    var sheetImport = STSheetImport(state,{apply:applySheetImport});
    var shell = STShell(state,{assistant:assistant.sync,signout:lockWorkspace,navigate:navigateView,home:showCaseHome,save:saveActiveCase,cases:function(){renderCases(state.bootstrap?.cases||[]);},redraw:renderPlaybackFrame});
    function navigateView(view) {
      if (!state.activeCase) return;
      state.uiView = view;
      if (view === 'comparison') showCaseComparison();
      else { state.workspaceView = 'simulation'; renderWorkspaceTabs(); }
      shell.sync(); renderPlaybackFrame();
    }

    document.addEventListener('DOMContentLoaded', function() {
      bindEvents();
      assistant.init();
      sheetImport.init();
      shell.init();
      if (STPreferences.read('remember') === 'yes') {
        document.getElementById('remember-session').checked = true;
        signIn();
      }
    });
    window.addEventListener('resize', function() { renderPlaybackFrame(); });
    window.addEventListener('scroll', function() {
      if (Date.now() >= state.scrollRestoreUntil) state.lastUserScrollAt = Date.now();
    }, { passive: true });

    function bindEvents() {
      document.getElementById('sign-in-form').addEventListener('submit', function(event) { event.preventDefault(); signIn(); });
      document.getElementById('sign-out').addEventListener('click', lockWorkspace);
      document.getElementById('home-cases').addEventListener('click', showCaseHome);
      document.getElementById('open-settings').addEventListener('click', STSettings.open);
      document.getElementById('show-new-case').addEventListener('click', function() {
        toggle('new-case-form', true); document.getElementById('new-case-name').focus();
      });
      document.getElementById('case-search').addEventListener('input', function() { renderCases(state.bootstrap ? state.bootstrap.cases : []); });
      document.getElementById('workspace-form').addEventListener('submit', saveWorkspace);
      document.getElementById('new-case-form').addEventListener('submit', createDraftCase);
      document.getElementById('create-public-demo-case').addEventListener('click', createPublicDemoCase);
      document.getElementById('reload-case').addEventListener('click', reloadActiveCase);
      document.getElementById('clone-case').addEventListener('click', cloneActiveSimulation);
      document.getElementById('delete-case').addEventListener('click', deleteActiveCase);
      document.getElementById('save-case').addEventListener('click', saveActiveCase);
      document.getElementById('add-equipment').addEventListener('click', addEquipment);
      document.getElementById('case-editor-form').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('input', markCaseDirty);
      document.getElementById('equipment-list').addEventListener('change', markCaseDirty);
      document.getElementById('add-control-event').addEventListener('click', addControlEvent);
      document.getElementById('run-simulation').addEventListener('click', runSimulation);
      document.getElementById('play-simulation').addEventListener('click', startPlayback);
      document.getElementById('pause-simulation').addEventListener('click', pausePlayback);
      document.getElementById('reset-playback').addEventListener('click', resetPlayback);
      document.getElementById('duration-mode').addEventListener('change', function(event) {
        state.run.durationMode = event.target.value;
      });
    }

    function signIn() {
      document.getElementById('sign-in-button').disabled = true;
      document.getElementById('auth-status').textContent = 'Verifying your Google access…';
      initialize();
    }

    function showCaseHome() {
      if(state.saving){setStatus('Saving your changes…');return false;}
      if (state.isDirty && !window.confirm('Discard unsaved changes and return to cases?')) return false;
      state.openSequence += 1;
      stopPlaybackTimer();
      state.activeCase = null;
      state.run.result = null;
      state.isDirty = false;
      ['editor-panel', 'run-panel', 'comparison-panel', 'workspace-tabs', 'engine-panel'].forEach(function(id) { toggle(id, false); });
      var connected = Boolean(state.bootstrap && state.bootstrap.settings.workspaceRootFolderId);
      toggle('cases-panel', connected);
      shell.sync();
      return true;
    }

    function lockWorkspace() {
      if (!showCaseHome()) return;
      state.requestEpoch += 1;
      STPreferences.write('remember', null);
      document.getElementById('remember-session').checked = false;
      state.bootstrap = null;
      assistant.reset();
      document.getElementById('cases-list').textContent = '';
      toggle('application', false); toggle('auth-panel', true);
      document.getElementById('auth-status').textContent = 'Signed out of Line Studio. Your Google account remains signed in.';
      document.getElementById('sign-in-button').focus();
    }

    function initialize() {
      setStatus('Loading console…');
      callServer('getBootstrap', [], renderBootstrap);
    }

    function renderBootstrap(response) {
      if (!response.ok) return showError(response.error);
      document.getElementById('sign-in-button').disabled = false;
      document.getElementById('auth-status').textContent = '';
      STPreferences.write('remember', document.getElementById('remember-session').checked ? 'yes' : null);
      toggle('auth-panel', false); toggle('application', true);
      state.bootstrap = response.data;
      STSettings.configureGemini(response.data.gemini || {});
      document.getElementById('user-email').textContent = response.data.user.email;
      document.getElementById('workspace-folder-id').value = response.data.settings.workspaceRootFolderId || '';
      document.getElementById('playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
      if (!state.run.playbackConfigured) {
        document.getElementById('run-playback-rate').value = String(response.data.settings.preferredPlaybackRate || 1);
        state.run.playbackConfigured = true;
      }

      var hasWorkspace = Boolean(response.data.settings.workspaceRootFolderId);
      document.getElementById('workspace-panel').classList.remove('hidden');
      toggle('cases-panel', hasWorkspace && !state.activeCase);
      toggle('engine-panel', false);
      renderCases(response.data.cases);
      setStatus(state.activeCase ? '' : (hasWorkspace ? '' : 'Open Settings to connect a Drive folder before creating a case.'));
      shell.sync();
    }

    function saveWorkspace(event) {
      event.preventDefault();
      STSettings.setSaving(true);
      callServer('saveUserSettings', [{
        workspaceRootFolderId: document.getElementById('workspace-folder-id').value,
        preferredPlaybackRate: Number(document.getElementById('playback-rate').value),
        gemini: {model:document.getElementById('gemini-model').value,apiKey:document.getElementById('gemini-api-key').value,clearKey:document.getElementById('gemini-clear-key').checked}
      }], function(response) {
        STSettings.setSaving(false);
        if (!response.ok) return STSettings.error(response.error.message || 'Settings could not be saved.');
        STSettings.saved();
        shell.toast('Settings saved');
        initialize();
      });
    }

    function createDraftCase(event) {
      event.preventDefault();
      var input = document.getElementById('new-case-name');
      setBusy('new-case-form', true);
      callServer('createCase', [{ name: input.value }], function(response) {
        setBusy('new-case-form', false);
        if (!response.ok) return showError(response.error);
        input.value = '';
        toggle('new-case-form', false);
        openCase(response.data.id);
        initialize();
      });
    }

    

function createPublicDemoCase() {
      setBusy('create-public-demo-case', true);
      callServer('createPublicDemoCase', [], function(response) {
        setBusy('create-public-demo-case', false);
        if (!response.ok) return showError(response.error);
        openCase(response.data.id);
        initialize();
      });
    }

    function deleteActiveCase() {
      if (!state.activeCase) return;
      requestCaseDeletion(state.activeCase.id, state.activeCase.name, document.getElementById('delete-case'));
    }

    function requestCaseDeletion(caseId, caseName, button) {
      if (!window.confirm('Move Case "' + caseName + '" to the Drive trash?')) return;
      if (button) button.disabled = true;
      callServer('deleteCase', [caseId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        var deletedActiveCase = state.activeCase && state.activeCase.id === caseId;
        if (deletedActiveCase) {
          stopPlaybackTimer();
          state.activeCase = null;
          state.isDirty = false;
          state.run.commands = [];
          state.run.result = null;
          state.run.configuration = null;
          state.liveZoneDetails = {};
          toggle('editor-panel', false);
          toggle('run-panel', false);
        }
        initialize();
        setStatus('Case moved to Drive trash.');
      });
    }

function openCase(caseId) {
      if (state.isDirty && !window.confirm('Discard unsaved changes and open this case?')) return;
      var sequence = ++state.openSequence;
      callServer('getCase', [caseId], function(response) {
        if(sequence !== state.openSequence) return;
        if (!response.ok) return showError(response.error);
        stopPlaybackTimer();
        state.activeCase = response.data;
        toggle('cases-panel', false);

        state.isDirty = false;
        state.workspaceView = 'simulation';
        state.uiView = 'simulation';
        state.liveZoneDetails = {};
        state.run.commands = [];
        state.run.result = null;
        state.run.configuration = null;
        initializePersistentSimulations();
        renderEditor();
        setStatus('Case loaded.');
      });
    }

    function reloadActiveCase() {
      if (!state.activeCase) return;
      openCase(state.activeCase.id);
    }

    function cloneActiveSimulation() {
      if (!state.activeCase) return;
      saveActiveCase(function() {
        cloneSavedActiveSimulation();
      });
    }

    function cloneSavedActiveSimulation(afterClone) {
      if (!state.activeCase) return;
      var button = document.getElementById('clone-case');
      if (button) button.disabled = true;
      callServer('cloneSimulation', [state.activeCase.id, state.activeSimulationId], function(response) {
        if (button) button.disabled = false;
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.activeSimulationId = response.data.simulations[response.data.simulations.length - 1].id;
        if (typeof afterClone === 'function') {
          afterClone(activePersistentSimulation());
          return;
        }
        renderWorkspaceTabs();
        activatePersistentSimulation(state.activeSimulationId);
        setStatus('Active simulation: ' + activePersistentSimulation().name + '. This is a clone; the source remains unchanged.');
      });
    }

    function markCaseDirty() {
      if (!state.activeCase) return;
      state.isDirty = true;
      renderEditorMeta();
      renderRunWorkspace();
    }

    function saveActiveCase(afterSave) {
      var next = collectCaseEditor();
      if (!next) return;
      var simulation = activePersistentSimulation();
      if (simulation) {
        simulation.equipment = cloneJson(next.equipment || []);
        simulation.dynamicConfig = cloneJson(readRunConfiguration() || simulation.dynamicConfig || {});
        next.simulations = cloneJson(state.activeCase.simulations || []);
      }
      if(state.saving) return;
      state.saving=true; shell.sync();
      setBusy('save-case', true);
      callServer('saveCase', [next], function(response) {
        state.saving=false; shell.sync();
        setBusy('save-case', false);
        if (!response.ok) return showError(response.error);
        state.activeCase = response.data;
        state.isDirty = false;
        renderEditor();
        initialize();
        if (typeof afterSave === 'function') afterSave(response.data);
        else setStatus('Case saved as revision ' + response.data.revision + '.');
      });
    }

    function applySheetImport(preview) {
      if (!state.activeCase || state.saving || !preview.canImport) return false;
      // Capture unsaved editor changes in the existing simulation before adding a new one.
      if (!syncEquipmentFromEditor()) return false;
      syncPersistentSimulation();
      var stamp=Date.now(),id='sheet-'+stamp;
      while(state.activeCase.simulations.some(function(sim){return sim.id===id;}))id='sheet-'+(++stamp);
      var imported={id:id,name:(preview.metadata.formatName||'Sheet import').slice(0,100)+' · '+(state.activeCase.simulations.length+1),equipment:cloneJson(preview.equipment),dynamicConfig:Object.assign({},readRunConfiguration(),{commands:[]}),results:null,scenario:{},sourceImport:{source:preview.source,metadata:preview.metadata,rows:preview.sourceRows,warnings:preview.warnings,notes:preview.notes},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      state.activeCase.simulations.push(imported);
      state.activeCase.metadata=Object.assign({},state.activeCase.metadata,{dataClassification:'USER_PROVIDED'});
      state.run.configuration=null;
      activatePersistentSimulation(id,true);
      state.isDirty=true;state.uiView='editor';
      renderEditorMeta();renderRawJson();shell.sync();
      setStatus('Imported '+preview.equipment.length+' equipment into a new simulation. Review Line setup and save the case.');
      return true;
    }

    function addEquipment() {
      if (!syncEquipmentFromEditor()) return;
      state.activeCase.equipment.push(createBlankEquipment());
      state.isDirty = true;
      renderEquipment();
      renderRunWorkspace();
    }

    function renderCases(cases) { STCaseGallery.render(cases, openCase, requestCaseDeletion); }

    function renderEditor() {
      if (!state.activeCase) return;
      toggle('editor-panel', true);
      var activeSimulation = activePersistentSimulation();
      document.getElementById('editor-title').textContent = state.activeCase.name + (activeSimulation ? ' · ' + activeSimulation.name : '');
      document.getElementById('case-name').value = state.activeCase.name;
      document.getElementById('unit-of-flow').value = state.activeCase.unitOfFlow || '';
      renderEditorMeta();
      renderCaseDataNote();
      renderEquipment();
      renderRawJson();
      renderRunWorkspace();
    }

    function renderEditorMeta() {
      if (!state.activeCase) return;
      var dirtyText = state.isDirty ? ' · unsaved changes' : '';
      var activeSimulation = activePersistentSimulation();
      var scenarioText = activeSimulation && activeSimulation.scenario && activeSimulation.scenario.title
        ? ' · What-If: ' + activeSimulation.scenario.title
        : '';
      shell.sync();
      document.getElementById('editor-meta').textContent = 'ID: ' + state.activeCase.id + ' · Active: ' + (activeSimulation ? activeSimulation.name : '—') + scenarioText + ' · Revision ' + state.activeCase.revision + dirtyText;
    }

    function renderCaseDataNote() {
      var target = document.getElementById('case-data-note');
      var metadata = state.activeCase && state.activeCase.metadata ? state.activeCase.metadata : {};
      var source=activePersistentSimulation()?.sourceImport;
      var note = source?.source ? 'Imported from '+source.source.sheetName+' · '+source.source.readAt+'. MTBF drives random failure intervals; MTTR is a fixed repair duration. Review the stored import assumptions before running.' : typeof metadata.dataNote === 'string' ? metadata.dataNote : '';
      target.textContent = note;
      toggle('case-data-note', Boolean(note));
    }

    function renderEquipment() {
      var target = document.getElementById('equipment-list');
      target.textContent = '';
      state.activeCase.equipment.forEach(function(equipment, index) {
        target.appendChild(createEquipmentCard(equipment, index));
      });
      if (!state.activeCase.equipment.length) {
        target.innerHTML = '<p class="empty">This draft has no equipment. Add at least two units before simulation.</p>';
      }
      renderRawJson();
    }

    function createEquipmentCard(equipment, index) {
      var card = document.createElement('article');
      card.className = 'equipment-card';
      card.dataset.index = String(index);
      card.innerHTML = '<div class="equipment-header"><strong></strong><div class="button-row"><button class="equipment-drag ghost icon-button" type="button" aria-label="Reorder equipment" title="Drag to reorder; use Arrow Up or Down on this handle"></button><button class="remove-equipment danger" type="button">Remove</button></div></div><div class="equipment-grid"><label>Equipment ID<input class="equipment-id"></label><label>Type<select class="equipment-type"><option value="BLOWER">Blower</option><option value="BLOWMOLDER">Blowmolder</option><option value="CONVEYOR">Conveyor</option><option value="PACEMAKER">Pacemaker</option><option value="PUCKER">Pucker</option><option value="FILLER">Filler</option><option value="DEPUCKER">De-pucker</option><option value="SLEEVER">Sleever</option><option value="CASE_PACKER">Case packer</option><option value="PALLETIZER">Palletizer</option><option value="CUSTOM">Other / custom</option></select></label><label>Name<input class="equipment-name"></label><label>Nominal rate / sec<input class="equipment-rate" type="number" min="0" step="any"></label><label>Initial mode<select class="equipment-mode"><option value="AUTO">Automatic</option><option value="MANUAL">Manual</option><option value="PAUSE">Paused</option><option value="STOP">Stopped</option></select></label></div><section class="format-zone-setup"><div class="format-zone-heading"><div><strong>FlowPilot conveyor design</strong><p>Required for every conveyor. Geometry is always active: the engine derives conveyor velocity, pitch, capacity, Prime, Back-up margin, recovery, and audit from these named inputs.</p></div></div><div class="format-zone-grid"><label>Installed length L_act (mm)<input class="format-zone-lact" type="number" min="0" step="any"></label><label>Prime reserve L_p (mm)<input class="format-zone-lp-prime" type="number" min="0" step="any"></label><label>Package length (mm)<input class="format-zone-package-length" type="number" min="0" step="any"></label><label>Upstream discharge pitch (mm)<input class="format-zone-discharge-pitch" type="number" min="0" step="any"></label><label>Conveyor speed factor (%)<input class="format-zone-speed-factor" type="number" min="0" step="any"></label><label>Installed Back-up position (mm)<input class="format-zone-backup" type="number" min="0" step="any"></label><label>Discharge runout (mm)<input class="format-zone-discharge-runout" type="number" min="0" step="any"></label><label>Reject runout (mm)<input class="format-zone-reject-runout" type="number" min="0" step="any"></label><label>Blocked time delay (s)<input class="format-zone-blocked-delay" type="number" min="0" step="any"></label><label>Clear time delay (s)<input class="format-zone-clear-delay" type="number" min="0" step="any"></label><label>Insurance factor (units)<input class="format-zone-insurance" type="number" min="0" step="any"></label><label>Upstream stop response (s)<input class="format-zone-stop-response" type="number" min="0" step="any"></label><label>Bottles discharged at stop<input class="format-zone-residual" type="number" min="0" step="any"></label><label>Downstream ramp-up (s)<input class="format-zone-downstream-ramp" type="number" min="0" step="any"></label></div><p class="format-zone-preview"></p></section><details class="equipment-json-details"><summary>Advanced JSON fields</summary><label class="characteristics-label">Characteristics JSON (optional)<textarea class="equipment-characteristics" spellcheck="false"></textarea></label><label class="characteristics-label">Noise profile JSON (optional)<textarea class="equipment-noise-profile" spellcheck="false"></textarea></label><label class="characteristics-label">Advanced process format JSON (optional)<textarea class="equipment-process-data" spellcheck="false"></textarea></label></details>';
      card.querySelector('strong').textContent = 'Step ' + (index + 1) + ' · ' + (equipment.type || 'CUSTOM') + ' · ' + (equipment.name || equipment.id || 'Unnamed') + ' · ' + (Number(equipment.nominalRatePerSecond || 0) * 60) + ' BPM';
      card.querySelector('.equipment-id').value = equipment.id || '';
      card.querySelector('.equipment-type').value = equipment.type || 'CUSTOM';
      card.querySelector('.equipment-name').value = equipment.name || '';
      card.querySelector('.equipment-rate').value = equipment.nominalRatePerSecond === undefined ? '' : equipment.nominalRatePerSecond;
      card.querySelector('.equipment-mode').value = equipment.initialMode || 'AUTO';
      card.querySelector('.equipment-characteristics').value = JSON.stringify(equipment.characteristics || {}, null, 2);
      card.querySelector('.equipment-noise-profile').value = JSON.stringify(equipment.noiseProfile || {}, null, 2);
      card.querySelector('.equipment-process-data').value = JSON.stringify(equipment.processData || {}, null, 2);

      applyConceptTooltips(card);
      populateFormatZoneInputs(card, equipment);
      updateFormatZoneVisibility(card);
      renderFormatZonePreview(card);

      STEquipmentDrag.bind(card,index,moveEquipment);
      var remove=card.querySelector('.remove-equipment');remove.innerHTML=STIcons.svg('trash');remove.classList.add('icon-button');remove.title='Delete equipment';remove.setAttribute('aria-label','Delete equipment');
      card.querySelector('.remove-equipment').addEventListener('click', function() { removeEquipment(index); });
      var collapse = document.createElement('button');
      collapse.type = 'button'; collapse.className = 'toggle-step secondary'; collapse.innerHTML = STIcons.svg('edit'); collapse.classList.add('icon-button');collapse.title='Edit equipment';collapse.setAttribute('aria-label','Edit equipment'); collapse.setAttribute('aria-expanded','false');
      collapse.addEventListener('click', function() { card.classList.toggle('equipment-card-expanded'); collapse.title=card.classList.contains('equipment-card-expanded')?'Collapse details':'Edit equipment';collapse.setAttribute('aria-label',collapse.title); collapse.setAttribute('aria-expanded',String(card.classList.contains('equipment-card-expanded'))); });
      card.querySelector('.equipment-header .button-row').prepend(collapse);
      card.querySelector('.equipment-type').addEventListener('change', function() {
        updateFormatZoneVisibility(card);
        renderFormatZonePreview(card);
      });
      Array.prototype.slice.call(card.querySelectorAll('.format-zone-grid input')).forEach(function(input) {
        input.addEventListener('input', function() {
          state.isDirty = true;
          renderFormatZonePreview(card);
        });
      });
      return card;
    }

    function applyConceptTooltips(card) {
      var concepts = [
        ['.format-zone-lact', 'Total installed conveyor length, measured from the upstream discharge toward the downstream infeed.'],
        ['.format-zone-lp-prime', 'Reserved downstream length between the Prime photocell and the downstream machine infeed.'],
        ['.format-zone-package-length', 'Physical package length in the direction of travel. It determines the photoeye occupied time.'],
        ['.format-zone-discharge-pitch', 'Centre-to-centre distance between packages leaving the upstream machine.'],
        ['.format-zone-speed-factor', 'Belt-speed increase relative to upstream package discharge velocity. It changes package spacing and population.'],
        ['.format-zone-backup', 'Installed Back-up photocell position, measured from the upstream discharge. A sustained blocked signal requests the upstream stop.'],
        ['.format-zone-discharge-runout', 'Length that must be cleared after the upstream discharge before a stop fully takes effect.'],
        ['.format-zone-reject-runout', 'Additional reject/runout length that must be cleared during an upstream stop.'],
        ['.format-zone-blocked-delay', 'Continuous Back-up blocked time required before the simulator requests the upstream stop. Normal package pulses do not count.'],
        ['.format-zone-clear-delay', 'Continuous Back-up clear time required before the simulator releases the upstream stop. Normal product gaps reset this timer.'],
        ['.format-zone-insurance', 'Extra package margin reserved in the required overflow calculation. It is a design margin, not randomly created material.'],
        ['.format-zone-stop-response', 'Delay from the upstream stop request until its discharge response is complete.'],
        ['.format-zone-residual', 'Packages that can still leave the upstream machine after the stop request.'],
        ['.format-zone-downstream-ramp', 'Time for the downstream machine to ramp after Prime authorizes its start.']
      ];
      concepts.forEach(function(entry) {
        var input = card.querySelector(entry[0]);
        if (input && input.closest('label')) input.closest('label').title = entry[1];
      });
      setFormatFieldLabel(card, '.format-zone-blocked-delay', 'Back-up blocked delay (s)');
      setFormatFieldLabel(card, '.format-zone-clear-delay', 'Back-up clear delay (s)');
    }

    function setFormatFieldLabel(card, selector, labelText) {
      var input = card.querySelector(selector);
      var label = input && input.closest('label');
      if (label && label.firstChild && label.firstChild.nodeType === Node.TEXT_NODE) {
        label.firstChild.nodeValue = labelText;
      }
    }

function populateFormatZoneInputs(card, equipment) {
      var formatZone = equipment.processData?.accumulation || {};
      var geometry = equipment.processData?.geometry || {};
      var upstream = equipment.processData?.upstream || {};
      var values = {
        lact: geometry.lactMm,
        lpPrime: geometry.lpPrimeMm,
        packageLength: upstream.packageLengthMm,
        dischargePitch: upstream.dischargePitchMm,
        speedFactor: firstDefinedValue(formatZone.conveyorSpeedFactorPercent, equipment.processData?.speedAndSensors?.conveyorSpeedFactorVsDischargeVelocityPercent),
        backup: formatZone.backupSensorPositionMm,
        dischargeRunout: formatZone.dischargeRunoutLengthMm,
        rejectRunout: formatZone.rejectRunoutLengthMm,
        blockedDelay: formatZone.blockedTimeDelaySeconds,
        clearDelay: formatZone.clearTimeDelaySeconds,
        insurance: formatZone.insuranceFactorUnits,
        stopResponse: formatZone.upstreamStopResponseSeconds,
        residual: formatZone.bottlesDischargedAtStop,
        downstreamRamp: formatZone.downstreamRampUpSeconds
      };
      Object.keys(values).forEach(function(key) {
        var input = card.querySelector('.format-zone-' + kebabCase(key));
        if (input) input.value = values[key] === undefined || values[key] === null ? '' : values[key];
      });
    }

function updateFormatZoneVisibility(card) {
      var isConveyor = card.querySelector('.equipment-type').value === 'CONVEYOR';
      card.querySelector('.format-zone-setup').classList.toggle('hidden', !isConveyor);
    }

    function renderFormatZonePreview(card) {
      var target = card.querySelector('.format-zone-preview');
      if (!target) return;
      if (card.querySelector('.equipment-type').value !== 'CONVEYOR') {
        target.textContent = '';
        return;
      }

      var values = readFormatZoneInputs(card);
      var processData = parseJsonForPreview(card.querySelector('.equipment-process-data').value);
      var index = Number(card.dataset.index);

    function buildSimulationAnalysis(simulation, result) {
      var proposals = buildWhatIfProposals(simulation, result);
      var primary = proposals.filter(function(item) { return item.recommended; }).sort(function(left, right) {
        return Number(right.priority || 0) - Number(left.priority || 0);
      })[0] || null;
      var summary = result.summary || {};
      var checks = [];
      if (isFiniteNumber(summary.lineOeePercent)) checks.push('Global OEE: ' + formatNumber(summary.lineOeePercent) + '% using ' + (summary.lineOeePacemakerName || 'the selected pacemaker') + '.');
      checks.push('Line losses: starvation ' + formatSeconds(summary.totalStarvedSeconds || 0) + ' · waiting for Prime ' + formatSeconds(summary.totalWaitingForPrimeSeconds || 0) + ' · failures ' + formatSeconds(summary.totalFailureSeconds || 0) + '.');
      proposals.filter(function(item) { return item.recommended || item.evidence; }).forEach(function(item) {
        if (item.evidence) checks.push(item.title + ': ' + item.evidence);
      });
      return { primary: primary, checks: uniqueAnalysisChecks(checks) };
    }

    function uniqueAnalysisChecks(checks) {
      return checks.filter(function(item, index) { return item && checks.indexOf(item) === index; });
    }

    function buildWhatIfProposals(simulation, result) {
      var target = selectWhatIfConveyorTarget(simulation, result);
      var summary = result.summary || {};
      var targetEngineering = target && target.metrics ? target.metrics.engineering : null;
      var audit = targetEngineering?.audit || null;
      var auditStatus = audit?.status || 'NOT_EVALUATED';
      var calculated = targetEngineering?.calculated || {};
      var input = targetEngineering?.input || {};
      var speedFactor = target ? readConveyorSpeedFactor(target.equipment) : null;
      var recommendedSpeedFactor = calculated.recommendedConveyorSpeedFactorPercent;
      var speedFactorDiffers = isFiniteNumber(speedFactor) && isFiniteNumber(recommendedSpeedFactor) &&
        recommendedSpeedFactor >= 0 && Math.abs(speedFactor - recommendedSpeedFactor) >= 0.25;
      var requiredBackup = calculated.recommendedBackupSensorPositionMm;
      var installedBackup = input.backupSensorPositionMm;
      var recoveryLength = calculated.recoveryLengthMm;
      var installedLengthGoal = findAuditGoal(audit, 'INSTALLED_LENGTH');
      var recoveryGoal = findAuditGoal(audit, 'SMOOTH_RECOVERY');
      var backupGoal = findAuditGoal(audit, 'BACKUP_POSITION');
      var sensorGoal = findAuditGoal(audit, 'SENSOR_DEBOUNCE');
      var recommendationInputsReady = hasPhysicalRecommendationInputs(input);
      var geometryNeedsRecovery = installedLengthGoal?.status === 'FAIL' || recoveryGoal?.status === 'WARNING' || backupGoal?.status === 'WARNING';
      var bufferPlan = geometryNeedsRecovery ? calculateBufferRecoveryPlan(targetEngineering) : null;
      var sensorDebounceNeedsTune = sensorGoal?.status === 'WARNING';
      var sensorDebouncePlan = sensorDebounceNeedsTune ? calculateSensorDebouncePlan(input, calculated) : null;
      var highWaitingOrStarvation = Number(summary.totalWaitingForPrimeSeconds || 0) > 30 || Number(summary.totalStarvedSeconds || 0) > 60;
      var reliabilityTargets = simulation.equipment.filter(function(equipment) {
        var profile = equipment.noiseProfile?.reliability;
        return equipment.type !== 'CONVEYOR' && profile && isFiniteNumber(profile.mtbfMinutes) && profile.mtbfMinutes > 0 &&
          isFiniteNumber(profile.mttrMinutes) && profile.mttrMinutes > 0;
      });
      var lowAvailability = Object.values(result.equipmentMetrics || {}).some(function(metrics) {
        return isFiniteNumber(metrics.availabilityPercent) && metrics.availabilityPercent < 85;
      });
      var reliabilityRecommended = Number(summary.totalFailureSeconds || 0) > 30 || lowAvailability;
      var auditMessages = auditGoalMessages(audit);
      var proposals = [];

      if (!target) {
        proposals.push({
          kind: 'INPUT_REQUIRED', title: 'Complete physical conveyor data', capex: 'INPUT REQUIRED', canApply: false,
          recommended: true, priority: 100, severity: 'INPUT_REQUIRED',
          finding: 'No physical conveyor can be evaluated',
          diagnosis: 'This simulation has no conveyor with FlowPilot geometry available for a physical recommendation.',
          description: 'Add a machine → conveyor → machine section with geometry before creating an automatic successor simulation.',
          evidence: 'No conveyor metrics were saved with this run.'
        });
        return proposals;
      }

      if (!recommendationInputsReady) {
        proposals.push({
          kind: 'INPUT_REQUIRED', title: 'Complete physical conveyor data', capex: 'INPUT REQUIRED', canApply: false,
          recommended: true, priority: 100, severity: 'INPUT_REQUIRED', target: target,
          finding: 'The physical audit is incomplete on ' + target.equipment.name,
          diagnosis: 'A safe sensor, speed, or buffer change cannot be calculated until the missing geometric inputs are supplied.',
          description: 'Complete the listed FlowPilot fields, save the simulation, and run it again before creating Simulation B.',
          evidence: missingPhysicalRecommendationInputs(input).join(', ') + '. ' + (auditMessages.join(' ') || 'Audit status: ' + auditStatus + '.')
        });
      }

      proposals.push({
        kind: 'BUFFER_RECOVERY', title: 'Restore buffer recovery', capex: 'HIGH CAPEX', target: target,
        bufferPlan: bufferPlan, canApply: Boolean(bufferPlan), recommended: geometryNeedsRecovery,
        priority: installedLengthGoal?.status === 'FAIL' ? 96 : recoveryGoal?.status === 'WARNING' ? 92 : backupGoal?.status === 'WARNING' ? 88 : 0,
        severity: installedLengthGoal?.status === 'FAIL' ? 'CRITICAL' : 'ATTENTION',
        finding: 'Physical recovery margin is insufficient on ' + target.equipment.name,
        diagnosis: 'The conveyor audit indicates that a normal stop/restart may consume the available accumulation margin before the upstream flow is recovered.',
        description: bufferPlan
          ? 'Set Back-up to the calculated required L_bu of ' + formatNumber(bufferPlan.backupSensorPositionMm) + ' mm and set L_act to the minimum modeled length of ' + formatNumber(bufferPlan.installedLengthMm) + ' mm (' + formatNumber(bufferPlan.addedLengthMm) + ' mm added).'
          : 'The audit found a geometry issue, but the available inputs cannot derive a valid recovery length.',
        evidence: 'Target: ' + target.equipment.name + ' · audit ' + auditStatus +
          (isFiniteNumber(recoveryLength) ? ' · L_rec ' + formatNumber(recoveryLength) + ' mm' : '') +
          (isFiniteNumber(requiredBackup) ? ' · required L_bu ' + formatNumber(requiredBackup) + ' mm' : '') +
          (highWaitingOrStarvation ? ' · observed waiting/starvation is elevated' : '')
      });

      proposals.push({
        kind: 'SENSOR_DEBOUNCE', title: 'Tune Back-up confirmation timers', capex: 'ZERO CAPEX', target: target,
        sensorDebouncePlan: sensorDebouncePlan, canApply: Boolean(sensorDebouncePlan && sensorDebouncePlan.changed),
        recommended: sensorDebounceNeedsTune && !geometryNeedsRecovery && recommendationInputsReady,
        priority: sensorDebounceNeedsTune ? 82 : 0, severity: 'ATTENTION',
        finding: 'Normal photoeye pulses can be mistaken for a sustained Back-up signal',
        diagnosis: 'At least one configured Back-up confirmation delay is not longer than the modeled occupied pulse or clear gap. The PLC may chatter or stop on normal package spacing.',
        description: sensorDebouncePlan
          ? 'Set blocked delay to ' + formatNumber(sensorDebouncePlan.blockedTimeDelaySeconds) + ' s and clear delay to ' + formatNumber(sensorDebouncePlan.clearTimeDelaySeconds) + ' s. These are simulated PLC confirmation settings; confirm them with controls engineering before plant use.'
          : 'Package pulse and gap timing are required to derive a safe confirmation-delay candidate.',
        evidence: 'Target: ' + target.equipment.name +
          (isFiniteNumber(calculated.packagePassSensorSeconds) ? ' · normal occupied pulse ' + formatNumber(calculated.packagePassSensorSeconds) + ' s' : '') +
          (isFiniteNumber(calculated.sensorClearGapSeconds) ? ' · normal clear gap ' + formatNumber(calculated.sensorClearGapSeconds) + ' s' : '') +
          ' · installed delays ' + formatNumber(input.blockedTimeDelaySeconds || 0) + ' s / ' + formatNumber(input.clearTimeDelaySeconds || 0) + ' s'
      });

      proposals.push({
        kind: 'SPEED_BALANCE', title: 'Balance downstream infeed speed', capex: 'ZERO CAPEX', target: target,
        recommendedSpeedFactorPercent: isFiniteNumber(recommendedSpeedFactor) && recommendedSpeedFactor >= 0 ? Number(recommendedSpeedFactor.toFixed(2)) : null,
        canApply: Boolean(target && speedFactorDiffers), recommended: speedFactorDiffers && !geometryNeedsRecovery,
        priority: speedFactorDiffers ? 64 : 0, severity: 'ATTENTION',
        finding: 'Infeed conveyor speed does not match the calculated downstream demand',
        diagnosis: 'The current belt factor differs from the FlowPilot infeed calculation, which includes the modeled downstream speed, infeed pitch, and 5% infeed overspeed.',
        description: speedFactorDiffers
          ? 'Change conveyor speed factor from ' + formatNumber(speedFactor) + '% to the calculated ' + formatNumber(recommendedSpeedFactor) + '%.'
          : 'The current factor is already aligned with the calculated downstream infeed demand.',
        evidence: 'Target: ' + target.equipment.name +
          (isFiniteNumber(calculated.recommendedInfeedConveyorSpeedMmPerSecond) ? ' · recommended infeed speed ' + formatNumber(calculated.recommendedInfeedConveyorSpeedMmPerSecond) + ' mm/s' : '') +
          (isFiniteNumber(calculated.sensorClearGapSeconds) ? ' · normal clear gap ' + formatNumber(calculated.sensorClearGapSeconds) + ' s' : '')
      });

      proposals.push({
        kind: 'RELIABILITY', title: 'Reliability sensitivity check', capex: 'LOW CAPEX / OPEX',
        canApply: reliabilityTargets.length > 0, recommended: reliabilityRecommended && !geometryNeedsRecovery,
        priority: reliabilityRecommended ? 52 : 0, severity: 'ATTENTION',
        finding: 'Intrinsic equipment downtime is reducing the result',
        diagnosis: 'Failures or low intrinsic availability were observed. This scenario is a transparent sensitivity check, not a claim that maintenance will achieve the result.',
        description: reliabilityTargets.length
          ? 'For ' + reliabilityTargets.length + ' critical machines, test the stated maintenance assumption: MTBF × 1.20 and MTTR × 0.85.'
          : 'MTBF and MTTR are required on at least one non-conveyor machine.',
        evidence: 'Failure ' + formatSeconds(summary.totalFailureSeconds || 0) +
          ' · availability trigger ' + (lowAvailability ? 'present' : 'not present') + '.'
      });

      return proposals;
    }

    function findAuditGoal(audit, id) {
      return (audit?.goals || []).find(function(goal) { return goal.id === id; }) || null;
    }

    function auditGoalMessages(audit) {
      return (audit?.goals || []).filter(function(goal) { return goal.status !== 'PASS'; }).map(function(goal) {
        return goal.id + ': ' + goal.message;
      });
    }

    function missingPhysicalRecommendationInputs(input) {
      var labels = [
        ['installedLengthMm', 'Installed length L_act'],
        ['primeReserveMm', 'Prime reserve L_p'],
        ['packageLengthMm', 'package length'],
        ['upstreamDischargePitchMm', 'upstream discharge pitch'],
        ['upstreamNominalSpeedBpm', 'upstream nominal speed'],
        ['conveyorSpeedFactorPercent', 'conveyor speed factor'],
        ['downstreamHighSpeedBpm', 'downstream high speed'],
        ['downstreamInfeedPitchMm', 'downstream infeed pitch']
      ];
      return labels.filter(function(item) {
        var value = input ? input[item[0]] : undefined;
        return !isFiniteNumber(value) || value < 0 || (item[0] !== 'primeReserveMm' && item[0] !== 'conveyorSpeedFactorPercent' && value === 0);
      }).map(function(item) { return item[1]; });
    }

    function hasPhysicalRecommendationInputs(input) {
      return missingPhysicalRecommendationInputs(input).length === 0;
    }

    function calculateSensorDebouncePlan(input, calculated) {
      var normalBlockedPulse = calculated?.packagePassSensorSeconds;
      var normalClearGap = calculated?.sensorClearGapSeconds;
      if (!isFiniteNumber(normalBlockedPulse) || !isFiniteNumber(normalClearGap)) return null;
      function minimumGreaterThan(value) {
        return Number((Math.ceil((value + 0.01) * 100) / 100).toFixed(2));
      }
      var currentBlocked = isFiniteNumber(input?.blockedTimeDelaySeconds) ? input.blockedTimeDelaySeconds : 0;
      var currentClear = isFiniteNumber(input?.clearTimeDelaySeconds) ? input.clearTimeDelaySeconds : 0;
      var blockedTimeDelaySeconds = Math.max(currentBlocked, minimumGreaterThan(normalBlockedPulse));
      var clearTimeDelaySeconds = Math.max(currentClear, minimumGreaterThan(normalClearGap));
      return {
        blockedTimeDelaySeconds: blockedTimeDelaySeconds,
        clearTimeDelaySeconds: clearTimeDelaySeconds,
        changed: blockedTimeDelaySeconds !== currentBlocked || clearTimeDelaySeconds !== currentClear
      };
    }

    function calculateBufferRecoveryPlan(engineering) {
      var calculator = window.SimulatorEngine?.calculateConveyorEngineering;
      var input = engineering?.input || {};
      if (!calculator || !isFiniteNumber(input.installedLengthMm) || !isFiniteNumber(input.primeReserveMm)) return null;
      var initialCalculation = calculator(input);
      var requiredBackup = initialCalculation?.calculated?.recommendedBackupSensorPositionMm;
      if (!isFiniteNumber(requiredBackup)) return null;

      function evaluate(installedLengthMm) {
        var withLength = calculator(Object.assign({}, input, { installedLengthMm: installedLengthMm }));
        var backup = withLength?.calculated?.recommendedBackupSensorPositionMm;
        if (!isFiniteNumber(backup)) return null;
        var assessment = calculator(Object.assign({}, input, {
          installedLengthMm: installedLengthMm,
          backupSensorPositionMm: Math.ceil(backup)
        }));
        return { assessment: assessment, backupSensorPositionMm: Math.ceil(backup), installedLengthMm: Math.ceil(installedLengthMm) };
      }

      function hasRecoveryMargin(plan) {
        if (!plan || !plan.assessment) return false;
        var audit = plan.assessment.audit;
        return findAuditGoal(audit, 'INSTALLED_LENGTH')?.status === 'PASS' &&
          findAuditGoal(audit, 'SMOOTH_RECOVERY')?.status === 'PASS' &&
          findAuditGoal(audit, 'BACKUP_POSITION')?.status === 'PASS';
      }

      var currentLength = Math.ceil(input.installedLengthMm);
      var lower = Math.max(currentLength, Math.ceil(input.primeReserveMm + requiredBackup + 1));
      var low = lower;
      var high = lower;
      var plan = evaluate(high);
      var ceiling = Math.max(high + 50000, high * 5);
      while (!hasRecoveryMargin(plan) && high < ceiling) {
        low = high;
        high += Math.max(100, Math.ceil(high * 0.2));
        plan = evaluate(high);
      }
      if (!hasRecoveryMargin(plan)) return null;

      while (high - low > 1) {
        var midpoint = Math.floor((low + high) / 2);
        var midpointPlan = evaluate(midpoint);
        if (hasRecoveryMargin(midpointPlan)) {
          high = midpoint;
          plan = midpointPlan;
        } else {
          low = midpoint;
        }
      }
      plan = evaluate(high);
      return {
        backupSensorPositionMm: plan.backupSensorPositionMm,
        installedLengthMm: plan.installedLengthMm,
        addedLengthMm: Math.max(0, plan.installedLengthMm - currentLength),
        recoveryLengthMm: plan.assessment?.calculated?.recoveryLengthMm
      };
    }

    function selectWhatIfConveyorTarget(simulation, result) {
      var metricsByOwner = {};
      Object.values(result.accumulationZoneMetrics || {}).forEach(function(metrics) {
        if (metrics && metrics.ownerEquipmentId) metricsByOwner[metrics.ownerEquipmentId] = metrics;
      });
      var duration = Math.max(1, Number(result.durationSeconds || 0));
      var candidates = (simulation.equipment || []).filter(function(equipment) {
        return equipment.type === 'CONVEYOR' || equipment.processData?.role === 'CONVEYOR';
      }).map(function(equipment) {
        var metrics = metricsByOwner[equipment.id] || null;
        var status = metrics?.engineering?.audit?.status || 'NOT_EVALUATED';
        var auditScore = status === 'FAIL' ? 400 : status === 'WARNING' ? 300 : status === 'NOT_EVALUATED' ? 200 : 100;
        var dynamicScore = metrics
          ? Number(metrics.overflowUnits || 0) * 20 + Number(metrics.emptyInventorySeconds || 0) / duration * 10 + Number(metrics.backupSignalBlockedSeconds || 0) / duration * 5
          : 0;
        return { equipment: equipment, metrics: metrics, score: auditScore + dynamicScore };
      });
      candidates.sort(function(left, right) { return right.score - left.score; });
      return candidates[0] || null;
    }

    function readConveyorSpeedFactor(equipment) {
      var accumulation = equipment?.processData?.accumulation || {};
      var speedSensors = equipment?.processData?.speedAndSensors || {};
      var value = accumulation.conveyorSpeedFactorPercent;
      if (!isFiniteNumber(value)) value = speedSensors.conveyorSpeedFactorVsDischargeVelocityPercent;
      return isFiniteNumber(value) ? value : null;
    }

    function createWhatIfScenario(kind, button) {
      var source = activePersistentSimulation();
      if (!source || !state.run.result) return;
      var proposal = buildWhatIfProposals(source, state.run.result).find(function(item) { return item.kind === kind; });
      if (!proposal || !proposal.canApply) return;
      if (button) button.disabled = true;

      // Persist first so the server clones exactly the configuration and result
      // the user is looking at, not an older Drive revision.
      saveActiveCase(function() {
        cloneSavedActiveSimulation(function(clone) {
          var changes = applyWhatIfOverrides(clone, proposal);
          clone.scenario = {
            kind: proposal.kind,
            title: proposal.title,
            capex: proposal.capex,
            sourceSimulationId: source.id,
            sourceSimulationName: source.name,
            createdAt: new Date().toISOString(),
            finding: proposal.finding,
            diagnosis: proposal.diagnosis,
            evidence: proposal.evidence,
            changes: changes
          };
          state.activeSimulationId = clone.id;
          activatePersistentSimulation(clone.id, true);
          state.isDirty = true;
          saveActiveCase(function() {
            setStatus('Created ' + clone.name + ' from ' + source.name + '. ' + proposal.title + ' is applied; review the changed inputs and run it when ready.');
          });
        });
      });
    }

    function applyWhatIfOverrides(simulation, proposal) {
      if (proposal.kind === 'SPEED_BALANCE') return applySpeedBalanceOverride(simulation, proposal);
      if (proposal.kind === 'BUFFER_RECOVERY') return applyBufferRecoveryOverride(simulation, proposal);
      if (proposal.kind === 'SENSOR_DEBOUNCE') return applySensorDebounceOverride(simulation, proposal);
      if (proposal.kind === 'RELIABILITY') return applyReliabilityOverride(simulation);
      return [];
    }

    function applySpeedBalanceOverride(simulation, proposal) {
      var target = proposal.target;
      var conveyor = simulation.equipment.find(function(equipment) { return equipment.id === target?.equipment?.id; });
      var next = proposal.recommendedSpeedFactorPercent;
      if (!conveyor || !isFiniteNumber(next)) return [];
      conveyor.processData = conveyor.processData || {};
      conveyor.processData.accumulation = conveyor.processData.accumulation || {};
      var current = readConveyorSpeedFactor(conveyor);
      conveyor.processData.accumulation.conveyorSpeedFactorPercent = next;
      return [{ equipmentId: conveyor.id, path: 'processData.accumulation.conveyorSpeedFactorPercent', before: current, after: next, unit: '%' }];
    }

    function applyBufferRecoveryOverride(simulation, proposal) {
      var target = proposal.target;
      var conveyor = simulation.equipment.find(function(equipment) { return equipment.id === target?.equipment?.id; });
      var plan = proposal.bufferPlan;
      if (!conveyor || !plan || !isFiniteNumber(plan.backupSensorPositionMm) || !isFiniteNumber(plan.installedLengthMm)) return [];
      conveyor.processData = conveyor.processData || {};
      conveyor.processData.geometry = conveyor.processData.geometry || {};
      conveyor.processData.accumulation = conveyor.processData.accumulation || {};
      var beforeBackup = conveyor.processData.accumulation.backupSensorPositionMm;
      var beforeLength = conveyor.processData.geometry.lactMm;
      conveyor.processData.accumulation.backupSensorPositionMm = plan.backupSensorPositionMm;
      conveyor.processData.geometry.lactMm = plan.installedLengthMm;
      return [
        { equipmentId: conveyor.id, path: 'processData.accumulation.backupSensorPositionMm', before: beforeBackup, after: plan.backupSensorPositionMm, unit: 'mm' },
        { equipmentId: conveyor.id, path: 'processData.geometry.lactMm', before: beforeLength, after: plan.installedLengthMm, unit: 'mm' }
      ].filter(function(change) { return change.before !== change.after; });
    }

    function applySensorDebounceOverride(simulation, proposal) {
      var target = proposal.target;
      var conveyor = simulation.equipment.find(function(equipment) { return equipment.id === target?.equipment?.id; });
      var plan = proposal.sensorDebouncePlan;
      if (!conveyor || !plan) return [];
      conveyor.processData = conveyor.processData || {};
      conveyor.processData.accumulation = conveyor.processData.accumulation || {};
      var beforeBlocked = conveyor.processData.accumulation.blockedTimeDelaySeconds;
      var beforeClear = conveyor.processData.accumulation.clearTimeDelaySeconds;
      conveyor.processData.accumulation.blockedTimeDelaySeconds = plan.blockedTimeDelaySeconds;
      conveyor.processData.accumulation.clearTimeDelaySeconds = plan.clearTimeDelaySeconds;
      return [
        { equipmentId: conveyor.id, path: 'processData.accumulation.blockedTimeDelaySeconds', before: beforeBlocked, after: plan.blockedTimeDelaySeconds, unit: 's' },
        { equipmentId: conveyor.id, path: 'processData.accumulation.clearTimeDelaySeconds', before: beforeClear, after: plan.clearTimeDelaySeconds, unit: 's' }
      ].filter(function(change) { return change.before !== change.after; });
    }

    function applyReliabilityOverride(simulation) {
      var changes = [];
      (simulation.equipment || []).forEach(function(equipment) {
        var reliability = equipment.noiseProfile?.reliability;
        if (equipment.type === 'CONVEYOR' || !reliability || !isFiniteNumber(reliability.mtbfMinutes) || !isFiniteNumber(reliability.mttrMinutes)) return;
        var beforeMtbf = reliability.mtbfMinutes;
        var beforeMttr = reliability.mttrMinutes;
        reliability.mtbfMinutes = Number((beforeMtbf * 1.2).toFixed(6));
        reliability.mttrMinutes = Number((beforeMttr * 0.85).toFixed(6));
        changes.push({ equipmentId: equipment.id, path: 'noiseProfile.reliability.mtbfMinutes', before: beforeMtbf, after: reliability.mtbfMinutes, unit: 'min' });
        changes.push({ equipmentId: equipment.id, path: 'noiseProfile.reliability.mttrMinutes', before: beforeMttr, after: reliability.mttrMinutes, unit: 'min' });
      });
      return changes;
    }

    function applyScenarioRunInputs(run) {
      if (!run) return;
      document.getElementById('run-duration').value = run.durationSeconds ?? document.getElementById('run-duration').defaultValue;
      document.getElementById('run-sample-interval').value = run.sampleEverySeconds ?? document.getElementById('run-sample-interval').defaultValue;
      document.getElementById('run-seed').value = run.seed ?? document.getElementById('run-seed').defaultValue;
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function addControlEvent() {
      if (!state.activeCase || !state.activeCase.equipment.length) return;
      state.run.commands.push({
        atVirtualSecond: 0,
        equipmentId: state.activeCase.equipment[0].id,
        action: 'PAUSE'
      });
      renderControlEvents();
    }

    function renderControlEvents() {
      var target = document.getElementById('control-events');
      target.textContent = '';
      state.run.commands.forEach(function(command, index) {
        target.appendChild(createControlEventRow(command, index));
      });
      if (!state.run.commands.length) {
        target.innerHTML = '<p class="empty compact-empty">No scheduled control events.</p>';
      }
    }

    function createControlEventRow(command, index) {
      var row = document.createElement('article');
      row.className = 'control-event';
      row.innerHTML = '<label>At virtual second<input class="command-time" type="number" min="0" step="any"></label><label>Equipment<select class="command-equipment"></select></label><label>Action<select class="command-action"><option value="RUN">Run</option><option value="PAUSE">Pause</option><option value="STOP">Planned stop</option><option value="EMERGENCY_STOP">Emergency stop</option><option value="RESET">Reset emergency stop</option><option value="MANUAL">Manual</option><option value="AUTO">Automatic</option></select></label><button class="remove-command danger" type="button">Remove</button>';
      var equipmentSelect = row.querySelector('.command-equipment');
      state.activeCase.equipment.forEach(function(equipment) {
        var option = document.createElement('option');
        option.value = equipment.id;
        option.textContent = equipment.name || equipment.id;
        equipmentSelect.appendChild(option);
      });
      row.querySelector('.command-time').value = command.atVirtualSecond;
      equipmentSelect.value = command.equipmentId;
      row.querySelector('.command-action').value = command.action;
      row.querySelector('.command-time').addEventListener('change', function(event) { state.run.commands[index].atVirtualSecond = Number(event.target.value); });
      equipmentSelect.addEventListener('change', function(event) { state.run.commands[index].equipmentId = event.target.value; });
      row.querySelector('.command-action').addEventListener('change', function(event) { state.run.commands[index].action = event.target.value; });
      row.querySelector('.remove-command').addEventListener('click', function() {
        state.run.commands.splice(index, 1);
        renderControlEvents();
      });
      return row;
    }

    function runSimulation() {
      if (state.isDirty && !collectCaseEditor()) return;
      var run = readRunConfiguration();
      if (!run) return;
      state.run.configuration = copyRunConfiguration(run);
      if (!calculateSimulation(run, 0)) return;
      var tab = activePersistentSimulation();
      if (tab) {
        tab.run = cloneJson(run);
        tab.results = createStoredSimulationResult(state.run.result, run);
        state.isDirty = true;
        saveActiveCase();
      }
      renderWorkspaceTabs();
      renderSimulationAnalysis();
      setStatus(state.run.durationMode === 'INDEFINITE'
        ? 'Simulation completed at its virtual safety ceiling. Playback is starting.'
        : 'Simulation completed. Playback is starting.');
      startPlayback();
    }

    function readRunConfiguration() {
      var durationSeconds = Number(document.getElementById('run-duration').value);
      var sampleEverySeconds = Number(document.getElementById('run-sample-interval').value);
      var seed = Number(document.getElementById('run-seed').value);
      if (!(durationSeconds > 0) || !(sampleEverySeconds > 0) || !Number.isInteger(seed)) {
        showError({ code: 'INVALID_RUN_CONFIGURATION', message: 'Duration, sample interval, and integer seed are required.' });
        return null;
      }
      return {
        durationSeconds: durationSeconds,
        tickSeconds: 0.25,
        sampleEverySeconds: sampleEverySeconds,
        seed: seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };
    }

    function copyRunConfiguration(run) {
      return {
        durationSeconds: run.durationSeconds,
        tickSeconds: run.tickSeconds,
        sampleEverySeconds: run.sampleEverySeconds,
        seed: run.seed
      };
    }

    function createStoredRunConfiguration() {
      var configuration = state.run.configuration;
      if (!configuration) return readRunConfiguration();
      return {
        durationSeconds: configuration.durationSeconds,
        tickSeconds: configuration.tickSeconds,
        sampleEverySeconds: configuration.sampleEverySeconds,
        seed: configuration.seed,
        commands: state.run.commands.map(function(command) {
          return {
            atVirtualSecond: Number(command.atVirtualSecond),
            equipmentId: command.equipmentId,
            action: command.action
          };
        })
      };
    }

    function calculateSimulation(run, resumeAtVirtualSecond) {
      var input = {
        case: JSON.parse(JSON.stringify(state.activeCase)),
        run: run
      };
      var response = window.SimulatorEngine.simulateLine(input);
      if (!response.ok) {
        showError(response.error);
        return false;
      }

      stopPlaybackTimer();
      state.run.result = response.result;
      state.run.sampleIndex = findSampleIndexAtOrBefore(response.result.samples, resumeAtVirtualSecond);
      toggle('simulation-results', true);
      document.getElementById('simulation-json-preview').value = JSON.stringify(response.result, null, 2);
      shell.sync();
      renderPlaybackFrame();
      return true;
    }

    function findSampleIndexAtOrBefore(samples, virtualSecond) {
      var selectedIndex = 0;
      for (var index = 0; index < samples.length; index += 1) {
        if (samples[index].virtualSecond > virtualSecond) break;
        selectedIndex = index;
      }
      return selectedIndex;
    }

    function startPlayback() {
      if (!state.run.result || state.run.playing) return;
      state.run.playing = true;
      schedulePlaybackStep();
    }

    function pausePlayback() {
      state.run.playing = false;
      stopPlaybackTimer();
      setPlaybackStatus('Paused');
    }

    function resetPlayback() {
      pausePlayback();
      if (!state.run.result) return;
      state.run.sampleIndex = 0;
      renderPlaybackFrame();
      setPlaybackStatus('Reset');
    }

    function schedulePlaybackStep() {
      renderPlaybackFrame();
      var samples = state.run.result.samples;
      if (state.run.sampleIndex >= samples.length - 1) {
        state.run.playing = false;
        setPlaybackStatus('Completed');
        return;
      }
      state.run.timer = window.setTimeout(function() {
        if (!state.run.playing) return;
        state.run.sampleIndex += 1;
        schedulePlaybackStep();
      }, playbackDelayMilliseconds());
    }

    function playbackDelayMilliseconds() {
      var samples = state.run.result ? state.run.result.samples : [];
      var current = samples[state.run.sampleIndex];
      var next = samples[state.run.sampleIndex + 1];
      if (!current || !next) return 0;
      var virtualSeconds = Math.max(0, next.virtualSecond - current.virtualSecond);
      var playbackRate = Number(document.getElementById('run-playback-rate').value || 1);
      // At 1×, virtual and wall-clock seconds match. A higher multiplier only
      // speeds up playback; it never changes the deterministic calculation.
      return Math.max(35, virtualSeconds * 1000 / playbackRate);
    }

    function stopPlaybackTimer() {
      if (state.run.timer) window.clearTimeout(state.run.timer);
      state.run.timer = null;
      state.run.playing = false;
    }

    function renderPlaybackFrame() {
      if (!state.run.result || !state.run.result.samples.length) return;
      var scrollAnchor = captureLiveEquipmentScrollAnchor();
      var sample = state.run.result.samples[state.run.sampleIndex];
      var time = sample.virtualSecond;
      document.getElementById('metric-time').textContent = time + ' s';
      document.getElementById('metric-output').textContent = formatNumber(sample.outputCount);
      document.getElementById('metric-instant-rate').textContent = formatInstantaneousOutputRate();
      document.getElementById('metric-rate').textContent = time > 0 ? formatRatePerMinute(sample.outputCount / time) : '—';
      document.getElementById('metric-buffer').textContent = formatNumber(sum(sample.buffers));
      document.getElementById('metric-overflow').textContent = formatNumber(sum((sample.accumulationZones || []).map(function(zone) { return zone.overflowUnits || 0; })));
      document.getElementById('metric-backup-stop').textContent = formatMinutes(sum(sample.equipment.map(function(unit) { return unit.backupStopSeconds || 0; })));
      document.getElementById('metric-line-oee').textContent = formatLineOeeAtSample(sample);
      setPlaybackStatus((state.run.playing ? 'Playing' : 'At') + ' ' + time + ' s · frame ' + state.run.sampleIndex + ' / ' + (state.run.result.samples.length - 1));
      if (state.uiView === 'simulation') renderLiveEquipment(sample);
      drawSimulationChart();
      drawEquipmentSpeedChart();
      restoreLiveEquipmentScrollAnchor(scrollAnchor);
    }

    function captureLiveEquipmentScrollAnchor() {
      var target = document.getElementById('live-equipment');
      if (!target) return null;
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!(viewportHeight > 0)) return null;
      var cards = target.querySelectorAll('.live-equipment-card');

    function formatPrimeSensorReading(prime) {
      if (!prime || !prime.configured) return 'Not configured';
      if (prime.state === 'PULSING') return 'PULSING · product passing';
      if (prime.state === 'BLOCKED') return 'BLOCKED · queue present';
      return prime.latched ? 'CLEAR · start sent' : 'CLEAR · waiting';
    }

    function formatBackupSensorReading(backup) {
      if (!backup || !backup.configured) return 'Not configured';
      if (backup.state === 'PULSING') return 'PULSING · normal flow';
      if (backup.state === 'BLOCKED') {
        return backup.controlActive
          ? 'BLOCKED · control active'
          : 'BLOCKED ' + formatSeconds(backup.blockedCandidateSeconds) + ' / ' + formatSeconds(backup.blockedTimeDelaySeconds);
      }
      if (backup.controlActive && backup.clearCandidateSeconds > 0) {
        return 'CLEAR ' + formatSeconds(backup.clearCandidateSeconds) + ' / ' + formatSeconds(backup.clearTimeDelaySeconds);
      }
      return backup.controlActive ? 'CLEAR · awaiting delay' : 'CLEAR';
    }

    function formatSensorTiming(geometry) {
      if (!geometry) return '—';
      var pulse = formatSeconds(geometry.packagePassSensorSeconds);
      var gap = formatSeconds(geometry.sensorClearGapSeconds);
      return pulse === '—' && gap === '—' ? '—' : pulse + ' / ' + gap;

function summarizeGeometrySources(sources, assumptions) {

    function bindLiveEquipmentControl(button, equipmentId, action) {

    function updateLiveEquipmentControl(button) {
      var sample = state.run.result && state.run.result.samples[state.run.sampleIndex];
      var isAtRunEnd = !sample || sample.virtualSecond >= state.run.result.durationSeconds;
      button.disabled = isAtRunEnd;
      button.title = (button.dataset.actionLabel || '') + ' — ' + (isAtRunEnd
        ? 'Reset playback to an earlier virtual time before applying a scenario control.'
        : 'Apply at the displayed virtual second and recalculate this simulation scenario.');
    }

    function applyLiveScenarioControl(equipmentId, action) {
      if (!state.run.result) return;
      var sample = state.run.result.samples[state.run.sampleIndex];
      if (!sample || sample.virtualSecond >= state.run.result.durationSeconds) {
        return setStatus('Reset playback to an earlier virtual time before applying a scenario control.');
      }

      var wasPlaying = state.run.playing;
      var actions = action === 'RESET_AND_RUN' ? ['RESET', 'RUN'] : [action];
      actions.forEach(function(nextAction) {
        state.run.commands.push({
          atVirtualSecond: sample.virtualSecond,
          equipmentId: equipmentId,
          action: nextAction
        });
      });
      renderControlEvents();

      var run = createStoredRunConfiguration();
      if (!run || !calculateSimulation(run, sample.virtualSecond)) return;
      var equipment = state.activeCase.equipment.find(function(item) { return item.id === equipmentId; });
      var label = equipment ? equipment.name : equipmentId;
      setStatus((action === 'RESET_AND_RUN' ? 'Reset and run' : action.replace(/_/g, ' ').toLowerCase()) + ' scheduled for ' + label + ' at virtual ' + sample.virtualSecond + ' s. The deterministic path was recalculated.');
      if (wasPlaying) startPlayback();
    }

    function sum(values) {
      return values.reduce(function(total, value) { return total + value; }, 0);

    function formatNumber(value) {
      return Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });

    function formatSeconds(value) {
      return isFiniteNumber(value) ? formatNumber(value) + ' s' : '—';
    }

    function formatRatePerMinute(ratePerSecond) {
      return formatNumber(Number(ratePerSecond || 0) * 60) + ' /min';
    }

    function formatPercent(value) {
      return isFiniteNumber(value) ? formatNumber(value * 100) + '%' : '—';
    }

    function formatMinutes(seconds) {
      return formatNumber(Number(seconds || 0) / 60) + ' min';
    }

    function callServer(name, args, onSuccess) {
      var epoch = state.requestEpoch;
      state.pendingRequests += 1;
      document.getElementById('request-progress').classList.remove('hidden');
      function done() {
        state.pendingRequests = Math.max(0,state.pendingRequests-1);
        document.getElementById('request-progress').classList.toggle('hidden',state.pendingRequests===0);
      }
      var runner = google.script.run
        .withFailureHandler(function() {
          done();
          if(epoch !== state.requestEpoch) return;
          state.saving=false;
          document.querySelectorAll('[data-busy="true"]').forEach(function(button){button.disabled=false;delete button.dataset.busy;});
          shell.sync();
          showError({ code: 'NETWORK_ERROR', message: 'The server request could not be completed. Please try again.' });
        })
        .withSuccessHandler(function(response) { done(); if(epoch === state.requestEpoch) onSuccess(response); });
      runner[name].apply(runner, args);
    }

    function toggle(id, visible) { document.getElementById(id).classList.toggle('hidden', !visible); }
    function setStatus(message) { var target = document.getElementById('status'); target.className = 'status'; target.textContent = message; }
    function showError(error) {
      var message = (error.code || 'ERROR') + ': ' + (error.message || 'The request failed.');
      var target = document.getElementById('status'); target.className = 'status error'; target.textContent = message;
      document.getElementById('auth-status').textContent = message;
      document.getElementById('sign-in-button').disabled = false;
      if (document.getElementById('settings-dialog').open) STSettings.error(message);
    }
    function setBusy(targetId, busy) { var target = document.getElementById(targetId); var button = target.tagName === 'FORM' ? target.querySelector('button') : target; button.disabled = busy; button.dataset.busy=String(busy); button.setAttribute("aria-busy",String(busy)); }
  })();
</script>
