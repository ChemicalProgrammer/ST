<script>
// Pure import comparison/merge. No DOM, network, persistence or engine mutation.
window.STSheetImportMerge=(function(){
  function copy(v){return JSON.parse(JSON.stringify(v));}
  function get(o,path){return path.split('.').reduce(function(v,k){return v==null?undefined:v[k];},o);}
  function put(o,path,value){var keys=path.split('.'),last=keys.pop();keys.forEach(function(k){if(!o[k]||typeof o[k]!=='object')o[k]={};o=o[k];});o[last]=value==null?null:copy(value);}
  function equal(a,b){return JSON.stringify(a==null?null:a)===JSON.stringify(b==null?null:b);}
  function name(v){return String(v||'').trim().toLowerCase();}
  function key(source){return (source?.spreadsheetId||'')+':'+(source?.sheetId===undefined?source?.sheetName:source.sheetId);}
  function field(id,col,label,paths){return {id:id,col:col,label:label,paths:paths,read:function(e){return get(e,paths[0]);},write:function(e,v){paths.forEach(function(p){put(e,p,v);});}};}
  var fields=[field('type','A','Type',['type']),field('name','B','Name',['name']),
    field('critical','C','Critical machine',['characteristics.criticalMachine']),
    field('mtbf','D','MTBF (min)',['processData.equipment.mtbfMinutes']),field('mttr','E','MTTR (min)',['processData.equipment.mttrMinutes']),
    field('maxSpeed','F','Maximum speed (bpm)',['processData.equipment.maximumSpeedBpm']),
    field('nominalSpeed','F','Nominal running speed (bpm) — initialized from F',['nominalRatePerSecond']),
    field('length','G','Total length (mm)',['processData.geometry.lactMm']),field('prime','H','Prime zone (mm)',['processData.geometry.lpPrimeMm']),
    field('discharge','I','Discharge actual (mm)',['processData.geometry.actualDischargeMm']),field('coding','J','Coding actual (mm)',['processData.geometry.actualCodingMm']),
    field('package','K','Package length (mm)',['processData.upstream.packageLengthMm']),field('pitch','L','Discharge pitch (mm)',['processData.upstream.dischargePitchMm']),
    field('startup','M','Startup time (s)',['processData.upstream.startupTimeSeconds']),field('residual','N','Bottles discharged at stop',['processData.upstream.bottlesDischargedAtStop','processData.accumulation.bottlesDischargedAtStop']),
    field('infeed','O','Downstream infeed pitch (mm)',['processData.downstream.infeedPitchMm']),field('ramp','P','Ramp-up including Prime delay (s)',['processData.downstream.rampUpTimeSeconds','processData.accumulation.downstreamRampUpSeconds']),
    field('speedFactor','Q','Speed factor vs discharge (%)',['processData.speedAndSensors.conveyorSpeedFactorVsDischargeVelocityPercent','processData.accumulation.conveyorSpeedFactorPercent']),
    field('codingFactor','R','Coding speed factor vs previous (%)',['processData.speedAndSensors.codingConveyorSpeedFactorVsPreviousConveyorPercent']),
    field('previousFactor','S','Conveyor factor vs previous (%)',['processData.speedAndSensors.conveyorSpeedFactorVsPreviousConveyorPercent']),
    field('blocked','T','Back-up blocked delay (s)',['processData.speedAndSensors.blockedTimeDelaySeconds','processData.accumulation.blockedTimeDelaySeconds']),
    field('clear','U','Back-up clear delay (s)',['processData.speedAndSensors.clearTimeDelaySeconds','processData.accumulation.clearTimeDelaySeconds']),
    field('insurance','V','Insurance factor (packages)',['processData.speedAndSensors.insuranceFactorUnits','processData.accumulation.insuranceFactorUnits']),
    field('overspeed','W','Overspeed vs infeed screw (%)',['processData.speedAndSensors.overspeedVsInfeedScrewPercent'])];
  fields.find(function(f){return f.id==='critical';}).read=function(e){return e.characteristics?.criticalMachine===undefined?['CRITICAL_MACHINE','PACEMAKER'].includes(e.processData?.role):e.characteristics.criticalMachine;};
  ['mtbf','mttr'].forEach(function(id){var f=fields.find(function(f){return f.id===id;});f.read=function(e){return get(e,'noiseProfile.reliability.'+(id==='mtbf'?'mtbfMinutes':'mttrMinutes'))??get(e,f.paths[0]);};});
  ['residual','ramp','speedFactor','blocked','clear','insurance'].forEach(function(id){var f=fields.find(function(f){return f.id===id;});f.read=function(e){return e.type==='CONVEYOR'?(get(e,f.paths[1])??get(e,f.paths[0])):get(e,f.paths[0]);};});
  var metadataFields=[['site','Site'],['packagingLine','Packaging line'],['formatName','Format name'],['containerSizeOz','Container size (oz)'],['bottlesPerCase','Bottles per case'],['dateOfAnalysis','Date of analysis'],['by','By']];
  function errorsFor(preview,col,row){return (preview.errors||[]).filter(function(e){var m=String(e.cell).match(/^([A-W])(\d+)(?::([A-W])(\d*)?)?$/);if(!m)return false;return row>=Number(m[2])&&row<=Number(m[4]||m[2])&&col>=m[1]&&col<=(m[3]||m[1]);});}
  function incomingValue(preview,record,f){var raw=(preview.sourceRows||[]).find(function(r){return r.row===record.row;});if(f.id==='critical'&&raw?.values?.critical===null)return null;return f.read(preview.equipment[record.index]);}
  function defaults(preview,record,equipment){var current=equipment.find(function(e){return e.id===record.target;}),incoming=preview.equipment[record.index];record.selected={};fields.forEach(function(f){var v=incomingValue(preview,record,f);record.selected[f.id]=!errorsFor(preview,f.col,record.row).length&&(!current||v!=null&&!equal(f.read(current),v));});return record;}
  function create(preview,current,sourceImport){
    var bindings=(sourceImport?.bindings||[]).slice(),sourceKey=key(preview.source);
    // Migration for full imports made before selective reload existed.
    if(!bindings.length&&sourceImport?.source){(sourceImport.rows||[]).forEach(function(r){var id='sheet-row-'+r.row;if(current.some(function(e){return e.id===id;}))bindings.push({equipmentId:id,sourceKey:key(sourceImport.source),sourceName:r.values.name,row:r.row});});}
    var records=preview.equipment.map(function(unit,index){
      var incomingName=name(unit.name),candidates=new Set();
      current.forEach(function(e){if(name(e.name)===incomingName)candidates.add(e.id);});
      bindings.forEach(function(b){if(b.sourceKey===sourceKey&&name(b.sourceName)===incomingName&&current.some(function(e){return e.id===b.equipmentId;}))candidates.add(b.equipmentId);});
      var ambiguous=candidates.size>1||preview.equipment.filter(function(e){return name(e.name)===incomingName;}).length>1;
      var row=unit.characteristics?.sourceSheetRow||index+10;
      var renamed=bindings.some(function(b){return b.sourceKey===sourceKey&&b.row===row&&name(b.sourceName)!==incomingName;});
      var target=ambiguous?'skip':candidates.size===1?Array.from(candidates)[0]:renamed?'skip':'new';
      // Invalid source rows require explicit selection of a target and valid fields.
      if((preview.errors||[]).some(function(e){return fields.some(function(f){return errorsFor(preview,f.col,row).includes(e);});}))target='skip';
      return defaults(preview,{index:index,row:row,target:target,reason:ambiguous?'Ambiguous name: choose the equipment to update.':renamed&&!candidates.size?'Name changed at this source row: choose an existing equipment or add new.':target==='new'?'New equipment — appended to the line.':'Matched by a unique name or previous import.',selected:{}},current);
    });
    var metadata={};metadataFields.forEach(function(f,i){metadata[f[0]]=!errorsFor(preview,'C',i+1).length&&preview.metadata[f[0]]!=null&&!equal(sourceImport?.metadata?.[f[0]],preview.metadata[f[0]]);});
    return {records:records,metadata:metadata,bindings:bindings};
  }
  function build(preview,plan,current,previous){
    var equipment=copy(current),sourceImport=copy(previous||{}),issues=[],used=new Set(),changes=[],added=0,updated=0;
    var metadata=copy(previous?.metadata||{}),metadataChanges=[];
    plan.records.forEach(function(record){
      if(record.target==='skip')return;
      var incoming=preview.equipment[record.index],isNew=record.target==='new';
      var selected=fields.filter(function(f){return record.selected[f.id];});if(!selected.length)return;
      if(!isNew&&used.has(record.target)){issues.push('Two Sheet rows target the same equipment. Skip one or choose another target.');return;}if(!isNew)used.add(record.target);
      var currentUnit=equipment.find(function(e){return e.id===record.target;});
      if(!isNew&&!currentUnit){issues.push('Target equipment no longer exists. Preview again.');return;}
      var unit=isNew?{id:incoming.id,type:'CUSTOM',name:'',nominalRatePerSecond:null,initialMode:'AUTO',characteristics:{},noiseProfile:{},processData:{}}:copy(currentUnit);
      if(isNew){var suffix=2,base=unit.id;while(equipment.some(function(e){return e.id===unit.id;}))unit.id=base+'-'+suffix++;}
      var applied=[];
      selected.forEach(function(f){var errs=errorsFor(preview,f.col,record.row);if(errs.length){issues.push(f.col+record.row+': fix this cell or deselect the field.');return;}var value=incomingValue(preview,record,f),before=f.read(unit);f.write(unit,value);applied.push({field:f.id,cell:f.col+record.row,before:before==null?null:before,after:value==null?null:value});});
      var reliability=selected.some(function(f){return ['mtbf','mttr'].includes(f.id);});
      if(reliability){var bf=record.selected.mtbf?fields[3].read(incoming):fields[3].read(currentUnit||{}),tr=record.selected.mttr?fields[4].read(incoming):fields[4].read(currentUnit||{});unit.noiseProfile=unit.noiseProfile||{};if(bf==null&&tr==null)delete unit.noiseProfile.reliability;else if(bf>0&&tr>0)unit.noiseProfile.reliability=Object.assign({},unit.noiseProfile.reliability,{mtbfMinutes:bf,mttrMinutes:tr});else issues.push(unit.name+': MTBF and MTTR must both be positive or both NA. Adjust the field selection.');}
      if(isNew||record.selected.type||record.selected.critical){unit.processData.role=unit.type==='CONVEYOR'?'CONVEYOR':unit.type==='PACEMAKER'?'PACEMAKER':unit.characteristics.criticalMachine?'CRITICAL_MACHINE':'MACHINE';unit.processData.machineType=unit.type;}
      if(unit.type!=='CONVEYOR')delete unit.processData.accumulation;
      if(!unit.name||!(unit.nominalRatePerSecond>0))issues.push('Row '+record.row+': new/updated equipment needs a name and positive nominal speed. Select those fields or skip the row.');
      var changed=isNew||!equal(currentUnit,unit);
      if(changed){if(isNew){equipment.push(unit);added++;}else{equipment[equipment.indexOf(currentUnit)]=unit;updated++;}}
      changes.push({equipmentId:unit.id,sourceName:incoming.name,row:record.row,sourceKey:key(preview.source),added:isNew,fields:applied});
    });
    metadataFields.forEach(function(f,i){if(!plan.metadata[f[0]])return;if(errorsFor(preview,'C',i+1).length){issues.push('C'+(i+1)+': fix or deselect the metadata field.');return;}var value=preview.metadata[f[0]];if(!equal(metadata[f[0]],value))metadataChanges.push({field:f[0],before:metadata[f[0]]??null,after:value??null});metadata[f[0]]=value??null;});
    var effective=added+updated+metadataChanges.length>0;
    sourceImport.source=copy(preview.source);sourceImport.metadata=metadata;sourceImport.rows=copy(preview.sourceRows||[]);sourceImport.warnings=copy(preview.warnings||[]);sourceImport.notes=copy(preview.notes||[]);
    var bindings=copy(plan.bindings);changes.forEach(function(c){bindings=bindings.filter(function(b){return !(b.equipmentId===c.equipmentId&&b.sourceKey===c.sourceKey);});bindings.push({equipmentId:c.equipmentId,sourceKey:c.sourceKey,sourceName:c.sourceName,row:c.row});});sourceImport.bindings=bindings;
    sourceImport.lastApplied={at:new Date().toISOString(),equipment:changes,metadata:metadataChanges};
    return {equipment:equipment,sourceImport:sourceImport,errors:issues,added:added,updated:updated,metadataChanges:metadataChanges.length,equipmentChanged:added+updated>0,hasChanges:effective};
  }
  function display(v,f){if(v==null)return 'NA';if(f?.id==='nominalSpeed')v=Number(v)*60;if(typeof v==='boolean')return v?'Y':'N';return typeof v==='number'?Number(v.toPrecision(12)).toString():String(v);}
  return {fields:fields,metadataFields:metadataFields,create:create,defaults:defaults,build:build,equal:equal,display:display,errorsFor:errorsFor,incomingValue:incomingValue};
})();
</script>
