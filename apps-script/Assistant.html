<script>
window.STAssistant = function(state) {
  var opened=false,caseId=null,messages=[],pending=false,sequence=0;
  function el(id){return document.getElementById(id);}
  function render(){
    el('gemini-messages').textContent='';
    messages.forEach(function(m){var p=document.createElement('p');p.className='gemini-message';p.dataset.role=m.role;var label=document.createElement('strong');label.textContent=m.role==='user'?'You':__ST_TEXT__('assistant.gemini');p.appendChild(label);p.appendChild(document.createTextNode(m.text));el('gemini-messages').appendChild(p);});
    el('gemini-messages').scrollTop=el('gemini-messages').scrollHeight;
  }
  function reset(){sequence++;messages=[];pending=false;caseId=null;opened=false;render();el('gemini-question').value='';el('gemini-error').textContent='';sync();}
  function sync(){
    var active=state.activeCase;
    if(caseId!==(active?.id||null)){sequence++;caseId=active?.id||null;messages=[];pending=false;render();el('gemini-question').value='';el('gemini-error').textContent='';}
    var visible=Boolean(active&&opened);
    el('application').classList.toggle('assistant-open',visible);el('gemini-panel').classList.toggle('hidden',!visible);el('toggle-gemini').setAttribute('aria-expanded',String(visible));
    el('gemini-context').textContent=active?active.name+__ST_TEXT__('assistant.saved_case'):'';
    var configured=Boolean(state.bootstrap?.gemini?.configured);
    el('gemini-notice').textContent=pending?__ST_TEXT__('assistant.gemini_is_analyzing_the_case'):!configured?__ST_TEXT__('assistant.add_your_gemini_api_key_in_settings_to_ask_questions'):state.isDirty?__ST_TEXT__('assistant.save_your_changes_before_asking_about_this_case'):__ST_TEXT__('assistant.context_includes_this_saved_case_and_all_saved_simulation_results');
    el('send-gemini').disabled=pending||!configured||state.isDirty||!active;el('send-gemini').setAttribute('aria-busy',String(pending));
    el('clear-gemini').disabled=pending;
  }
  function init(){
    var resize=el('gemini-resize');
    function width(value){var max=Math.max(360,Math.min(window.innerWidth-60,window.innerWidth*.65));var next=Math.round(Math.max(360,Math.min(max,value)));document.documentElement.style.setProperty('--assistant-width',next+'px');resize.setAttribute('aria-valuemin','360');resize.setAttribute('aria-valuemax',String(Math.round(max)));resize.setAttribute('aria-valuenow',String(next));STPreferences.write('assistant-width',String(next));return next;}
    width(Number(STPreferences.read('assistant-width'))||360);
    resize.onkeydown=function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();width(Number(resize.getAttribute('aria-valuenow'))+(e.key==='ArrowLeft'?24:-24));window.dispatchEvent(new Event('resize'));}};
    resize.onpointerdown=function(e){if(e.button!==0)return;e.preventDefault();resize.setPointerCapture(e.pointerId);resize.onpointermove=function(ev){width(window.innerWidth-ev.clientX);};function finish(){resize.onpointermove=null;window.dispatchEvent(new Event('resize'));}resize.onpointerup=finish;resize.onpointercancel=finish;resize.onlostpointercapture=finish;};
    window.addEventListener('resize',function(){width(Number(STPreferences.read('assistant-width'))||360);});

    el('toggle-gemini').onclick=function(){opened=!opened;sync();if(opened)el('gemini-question').focus();window.dispatchEvent(new Event('resize'));};
    el('close-gemini').onclick=function(){opened=false;sync();el('toggle-gemini').focus();window.dispatchEvent(new Event('resize'));};
    el('gemini-panel').addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();el('close-gemini').click();}});
    el('clear-gemini').onclick=function(){messages=[];render();el('gemini-error').textContent='';};
    el('gemini-form').onsubmit=function(e){
      e.preventDefault();sync();if(el('send-gemini').disabled)return;
      var question=el('gemini-question').value.trim();if(!question)return;
      var request={caseId:caseId,simulationId:state.activeSimulationId,question:question,history:messages.slice(-24)},ticket=++sequence;
      pending=true;el('gemini-error').textContent='';messages.push({role:'user',text:question});el('gemini-question').value='';render();sync();
      function finish(response){if(ticket!==sequence)return;pending=false;if(response.ok)messages.push({role:'model',text:response.data.text});else {messages.pop();el('gemini-question').value=question;el('gemini-error').textContent=response.error.message;}render();sync();}
      google.script.run.withFailureHandler(function(){finish({ok:false,error:{message:__ST_TEXT__('assistant.gemini_could_not_be_reached_try_again')}});}).withSuccessHandler(finish).askGemini(request);
    };
  }
  return {init:init,sync:sync,reset:reset};
};
</script>
