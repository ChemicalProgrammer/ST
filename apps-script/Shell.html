<script>
window.STShell = function(state,actions) {
  var collapsed=STPreferences.read('sidebar')==='collapsed', toastTimer;
  function sync() {
    var active=Boolean(state.activeCase),view=active?(state.uiView||'simulation'):'cases';
    var connected=Boolean(state.bootstrap?.settings?.workspaceRootFolderId);
    ['cases','editor','run','results','whatif','comparison'].forEach(function(name){var visible=(name==='cases'&&view==='cases')||(name==='editor'&&view==='editor')||(name==='run'&&view==='simulation')||(name==='results'&&view==='results')||((name==='whatif'||name==='comparison')&&view==='whatif');document.getElementById(name+'-panel').classList.toggle('hidden',!visible);});
    document.getElementById('workspace-tabs').classList.toggle('hidden',!active);
    document.getElementById('home-cases').setAttribute('aria-current',view==='cases'?'page':'false');
    document.querySelectorAll('.sidebar [data-view]').forEach(function(button){button.disabled=!active;button.setAttribute('aria-current',button.dataset.view===view?'page':'false');button.title=active?button.getAttribute('aria-label'):'Open a case first';});
    document.getElementById('breadcrumb-case').textContent=active?state.activeCase.name:'Workspace';
    document.getElementById('breadcrumb-view').textContent={cases:'Cases',editor:'Line setup',simulation:'Simulation',results:'Results',whatif:'What-If'}[view];
    var save=document.getElementById('save-workspace-case');save.classList.toggle('hidden',!active);save.disabled=!state.isDirty || state.saving;save.innerHTML=STIcons.svg('save')+(state.isDirty?'Save changes':'Saved');
    document.getElementById('show-new-case').disabled=!connected; document.getElementById('create-public-demo-case').disabled=!connected;
    document.getElementById('whatif-empty').classList.toggle('hidden',Boolean(state.run.result));
    if(view==='results') STResults.render(state.run.result,state.activeCase);
    STIcons.decorate(document);
  }
  function toast(message) {var el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.add('hidden');},4000);}
  function init(){
    STSettings.init();STIcons.decorate();
    function collapse(){document.getElementById('application').classList.toggle('sidebar-collapsed',collapsed);var el=document.getElementById('collapse-sidebar');el.setAttribute('aria-expanded',String(!collapsed));el.setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');el.title=el.getAttribute('aria-label');}
    collapse();document.getElementById('collapse-sidebar').onclick=function(){collapsed=!collapsed;STPreferences.write('sidebar',collapsed?'collapsed':'expanded');collapse();setTimeout(actions.redraw,180);};
    document.querySelectorAll('[data-view]').forEach(function(button){button.addEventListener('click',function(){actions.navigate(button.dataset.view);});});
    document.getElementById('save-workspace-case').onclick=function(){actions.save();};
    document.getElementById('cancel-new-case').onclick=function(){document.getElementById('new-case-form').classList.add('hidden');document.getElementById('show-new-case').focus();};
    ['case-filter','case-sort'].forEach(function(id){document.getElementById(id).onchange=actions.cases;});
    var dialog=document.getElementById('command-dialog'),input=document.getElementById('command-search'),list=document.getElementById('command-list');
    function commands(){list.textContent='';var entries=[['Cases','folder',actions.home],['Settings','settings',STSettings.open]];
      if(state.activeCase)entries.push(['Line setup','edit',function(){actions.navigate('editor');}],['Simulation','play',function(){actions.navigate('simulation');}],['Results','chart',function(){actions.navigate('results');}],['What-If','flask',function(){actions.navigate('whatif');}]);
      entries.filter(function(e){return e[0].toLowerCase().includes(input.value.toLowerCase());}).forEach(function(e){var b=document.createElement('button');b.className='ghost';b.innerHTML=STIcons.svg(e[1])+e[0];b.onclick=function(){dialog.close();e[2]();};list.appendChild(b);});
      if(!list.children.length)list.textContent='No matching commands.';
    }
    function openCommands(){if(document.getElementById('application').classList.contains('hidden')||document.querySelector('dialog[open]'))return;input.value='';commands();dialog.showModal();input.focus();}
    document.getElementById('open-commands').onclick=openCommands;input.oninput=commands;
    input.onkeydown=function(e){if(e.key==='ArrowDown'){e.preventDefault();list.querySelector('button')?.focus();}if(e.key==='Enter'){e.preventDefault();list.querySelector('button')?.click();}};
    list.onkeydown=function(e){if(!['ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();var buttons=Array.from(list.querySelectorAll('button')),index=buttons.indexOf(document.activeElement);buttons[(index+(e.key==='ArrowDown'?1:buttons.length-1))%buttons.length]?.focus();};
    document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommands();}});
    window.addEventListener('st:theme',actions.redraw);
    sync();
  }
  return {init:init,sync:sync,toast:toast};
};
</script>
